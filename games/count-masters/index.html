<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Count Masters: Stickman Games</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d1a;
      --surface: #14142b;
      --border: #2a2a50;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #64748b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }
    .topbar .brand { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; }
    .topbar .brand a { color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
    .topbar .brand a:hover { color: var(--text); }
    .topbar .sep { color: var(--muted); }
    .topbar-actions { margin-left: auto; display: flex; gap: 0.6rem; }

    .btn {
      padding: 0.45rem 1rem; border-radius: 8px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; border: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.85; transform: scale(1.02); }
    .btn:active { transform: scale(0.97); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--accent); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #5b21b6); color: #fff; }
    .btn-secondary { background: linear-gradient(135deg, #374151, #1f2937); color: #e2e8f0; border: 1px solid var(--border); }
    .btn-danger { background: linear-gradient(135deg, #dc2626, #991b1b); color: #fff; }
    .btn-success { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; }

    /* ── GAME AREA ── */
    .game-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      gap: 1.5rem;
    }

    /* ── SIDEBAR ── */
    .sidebar { display: flex; flex-direction: column; gap: 1rem; width: 140px; }
    .stat-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.9rem;
    }
    .stat-label {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); margin-bottom: 0.3rem;
    }
    .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--accent2); font-variant-numeric: tabular-nums; }
    .stat-value.red { color: #f87171; }
    .stat-value.green { color: #4ade80; }

    .tip-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.9rem;
      font-size: 0.75rem; color: var(--muted); line-height: 1.7;
    }

    /* ── CANVAS ── */
    #gameCanvas {
      border-radius: 12px;
      border: 2px solid var(--border);
      display: block;
      cursor: none;
    }

    /* ── MODAL ── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.82); backdrop-filter: blur(6px);
      z-index: 200; align-items: center; justify-content: center;
    }
    .overlay.active { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 2rem 2.2rem;
      max-width: 560px; width: 90%; text-align: center;
    }
    .modal h2 { font-size: 1.7rem; font-weight: 800; margin-bottom: 0.4rem; }
    .modal .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.4rem; }
    .modal .instructions {
      background: var(--bg); border-radius: 10px;
      padding: 1rem; text-align: left; margin-bottom: 1.2rem;
    }
    .modal .instructions h3 {
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--accent2); margin-bottom: 0.6rem;
    }
    .modal .instructions ul {
      list-style: none; font-size: 0.84rem; color: var(--muted);
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .modal .instructions li { display: flex; align-items: flex-start; gap: 0.6rem; }
    .modal .instructions .icon { font-size: 1.1rem; flex-shrink: 0; margin-top: -1px; }
    .modal-score { font-size: 2.8rem; font-weight: 900; color: var(--accent2); margin: 0.4rem 0; }
    .modal-buttons { display: flex; gap: 0.7rem; justify-content: center; margin-top: 1rem; }
    .modal-buttons .btn { white-space: nowrap; }
    @media (max-width: 480px) { .modal-buttons { gap: 0.4rem; } .modal-buttons .btn { padding: 0.6rem 0.75rem !important; font-size: 0.92rem !important; } }
    .btn-online { background: linear-gradient(135deg, #06b6d4, #0e7490); color: #fff; }
    /* online race board */
    #raceBoard { display: none; }
    .race-only { display: none !important; }
    body.racing .race-only { display: flex !important; }
    body.racing #raceBoard { display: block; }
    body.racing .solo-only, body.racing #pauseBtn, body.racing #restartBtn, body.racing #howToPlayBtn { display: none !important; }
    .rb-title { font-size: 0.95rem; font-weight: 700; color: #aab4c5; margin-bottom: 0.5rem; }
    .rb-row { padding: 0.45rem 0; border-top: 1px solid var(--border); }
    .rb-row:first-of-type { border-top: none; }
    .rb-top { display: flex; align-items: center; gap: 0.45rem; font-size: 0.95rem; font-weight: 700; }
    .rb-top .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .rb-top .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #eef2f7; }
    .rb-top .ct { font-variant-numeric: tabular-nums; color: #4ade80; }
    .rb-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 0.35rem; overflow: hidden; }
    .rb-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #7c3aed, #06b6d4); }
    .rb-sub { font-size: 0.8rem; color: #aab4c5; margin-top: 0.2rem; }
    .rb-note { font-size: 0.85rem; color: #fde68a; margin-top: 0.5rem; line-height: 1.5; }
    .race-table { width: 100%; border-collapse: collapse; margin: 0.6rem 0 0.4rem; font-size: 0.98rem; }
    .race-table th { color: #aab4c5; font-weight: 700; font-size: 0.85rem; padding: 0.35rem 0.4rem; text-align: left; border-bottom: 1px solid var(--border); }
    .race-table td { padding: 0.45rem 0.4rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .race-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .race-table tr.me td { color: #67e8f9; font-weight: 700; }
    .race-table tr.top td:first-child { color: #fbbf24; }
    .race-next { color: #aab4c5; font-size: 0.92rem; margin-top: 0.4rem; }
    .race-toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: rgba(88,28,135,0.95); color: #fff;
      padding: 0.6rem 1.2rem; border-radius: 14px; font-weight: 800; z-index: 300; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .race-toast.show { opacity: 1; }

    /* Pause badge */
    .pause-badge {
      display: none;
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(124,58,237,0.92);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.4rem 1.4rem;
      border-radius: 50px;
      z-index: 150;
      pointer-events: none;
    }
    .pause-badge.visible { display: block; }

    /* Gate legend */
    .gate-legend {
      display: flex; gap: 0.6rem; justify-content: center; margin-bottom: 1rem;
    }
    .legend-item {
      display: flex; align-items: center; gap: 0.35rem;
      font-size: 0.78rem; color: var(--muted);
    }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    #game-avatar{display:flex;align-items:center;margin-left:0.5rem;}
  </style>
<link rel="stylesheet" href="../shared/readable.css">
</head>
<body>
<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">
    <a href="../../">🎮 GameZone</a>
    <span class="sep">/</span>
    <span data-i18n="title"></span>
  </div>
  <div class="topbar-actions">
    <div data-lang-switch></div>
    <button class="btn btn-ghost" id="howToPlayBtn" data-i18n="howTo"></button>
    <button class="btn btn-ghost" id="pauseBtn" data-i18n="pause"></button>
    <button class="btn btn-ghost" id="restartBtn" data-i18n="restart"></button>
    <button class="btn btn-danger" id="exitBtn" data-i18n="exit"></button>
  </div>
  <div id="game-avatar"></div>
</div>

<div class="pause-badge" id="pauseBadge" data-i18n="paused"></div>

<!-- GAME AREA -->
<div class="game-wrapper">

  <div class="sidebar">
    <div class="stat-box solo-only">
      <div class="stat-label" data-i18n="level"></div>
      <div class="stat-value" id="levelDisplay">1</div>
    </div>
    <div class="stat-box solo-only">
      <div class="stat-label" data-i18n="score"></div>
      <div class="stat-value" id="scoreDisplay">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label" data-i18n="army"></div>
      <div class="stat-value green" id="countDisplay">10</div>
    </div>
    <div class="tip-box">
      <div class="stat-label" data-i18n="gates"></div>
      <div style="display:flex;flex-direction:column;gap:0.35rem;margin-top:0.3rem">
        <div style="display:flex;align-items:center;gap:0.4rem">
          <div style="width:10px;height:10px;background:#22c55e;border-radius:2px;flex-shrink:0"></div>
          <span data-i18n="grow"></span>
        </div>
        <div style="display:flex;align-items:center;gap:0.4rem">
          <div style="width:10px;height:10px;background:#ef4444;border-radius:2px;flex-shrink:0"></div>
          <span data-i18n="shrink"></span>
        </div>
        <div class="race-only" style="display:flex;align-items:center;gap:0.4rem">
          <div style="width:10px;height:10px;background:#a855f7;border-radius:2px;flex-shrink:0"></div>
          <span data-i18n="stealLegend"></span>
        </div>
      </div>
    </div>
  </div>

  <canvas id="gameCanvas" width="380" height="620"></canvas>

  <div class="sidebar">
    <div class="stat-box" id="raceBoard">
      <div class="rb-title" id="rbTitle"></div>
      <div id="rbRows"></div>
      <div class="rb-note" id="rbNote"></div>
    </div>
    <div class="stat-box solo-only">
      <div class="stat-label" data-i18n="enemy"></div>
      <div class="stat-value red" id="enemyDisplay">—</div>
    </div>
    <div class="tip-box">
      <div class="stat-label" data-i18n="controls"></div>
      <div style="font-size:0.75rem;line-height:1.8;color:var(--muted)" data-i18n-html="controlsText"></div>
    </div>
    <div class="tip-box solo-only">
      <div class="stat-label" data-i18n="tip"></div>
      <div style="font-size:0.75rem;color:var(--muted);line-height:1.6" data-i18n="tipText"></div>
    </div>
  </div>

</div>

<!-- INSTRUCTION MODAL -->
<div class="overlay active" id="startOverlay">
  <div class="modal">
    <div style="display:flex;justify-content:flex-end;margin:-0.4rem -0.4rem 0.3rem 0"><div data-lang-switch="full"></div></div>
    <h2 data-i18n="gameTitle"></h2>
    <p class="subtitle" data-i18n="subtitle"></p>
    <div class="instructions">
      <h3 data-i18n="howToH"></h3>
      <ul data-i18n-html="rules"></ul>
    </div>
    <div class="gate-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div> ×2, ×3, +10, +20</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> ÷2, −5, −10</div>
    </div>
    <div class="modal-buttons">
      <button class="btn btn-secondary" id="continueBtn" style="display:none;font-size:1rem;padding:0.7rem 1.5rem"></button>
      <button class="btn btn-primary" id="startBtn" style="font-size:1rem;padding:0.7rem 1.5rem" data-i18n="startGame"></button>
      <button class="btn btn-online" id="onlineBtn" style="font-size:1rem;padding:0.7rem 1.5rem" data-i18n="onlineBtn"></button>
      <button class="btn btn-danger" onclick="window.location.href='../../'" style="font-size:1rem;padding:0.7rem 1.5rem" data-i18n="exit"></button>
    </div>
  </div>
</div>

<!-- ONLINE RACE RESULT -->
<div class="overlay" id="raceOverlay">
  <div class="modal">
    <h2 id="raceTitle"></h2>
    <p class="subtitle" id="raceSub"></p>
    <table class="race-table" id="raceTable"></table>
    <div class="race-next" id="raceNext"></div>
    <div class="modal-buttons" id="raceBtns">
      <button class="btn btn-primary" id="raceAgainBtn"></button>
      <button class="btn btn-ghost" id="raceCloseBtn" data-i18n="viewTrack"></button>
      <button class="btn btn-danger" id="raceLeaveBtn" data-i18n="leaveRoom"></button>
    </div>
  </div>
</div>
<div class="race-toast" id="raceToast"></div>

<!-- RESULT MODAL -->
<div class="overlay" id="resultOverlay">
  <div class="modal">
    <h2 id="resultTitle" data-i18n="victory"></h2>
    <p class="subtitle" id="resultSubtitle"></p>
    <div class="modal-score" id="finalScore">0</div>
    <p style="font-size:0.82rem;color:var(--muted);margin-bottom:0.5rem" id="resultDetail"></p>
    <div class="modal-buttons">
      <button class="btn btn-primary" id="resultContinueBtn" style="display:none" data-i18n="nextLevel"></button>
      <button class="btn btn-primary" id="resultRestartBtn" data-i18n="playAgain"></button>
      <button class="btn btn-danger" id="resultExitBtn" data-i18n="exit"></button>
    </div>
  </div>
</div>

<script src="../shared/i18n.js"></script>
<script src="../shared/online.js"></script>

const Sound = (() => {
  let _ac = null;
  function ac() {
    if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if (_ac.state === 'suspended') _ac.resume();
    return _ac;
  }
  function tone(freq, type, when, dur, vol = 0.25) {
    const c = ac(), osc = c.createOscillator(), g = c.createGain();
    osc.connect(g); g.connect(c.destination);
    osc.type = type; osc.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(0.001, when);
    g.gain.linearRampToValueAtTime(vol, when + Math.min(0.015, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    osc.start(when); osc.stop(when + dur + 0.02);
  }
  function sweep(f1, f2, type, when, dur, vol = 0.25) {
    const c = ac(), osc = c.createOscillator(), g = c.createGain();
    osc.connect(g); g.connect(c.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(f1, when);
    osc.frequency.exponentialRampToValueAtTime(f2, when + dur);
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    osc.start(when); osc.stop(when + dur + 0.02);
  }
  function noise(when, dur, vol = 0.15, hz = 1000, q = 1) {
    const c = ac();
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), filt = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; filt.type = 'bandpass'; filt.frequency.value = hz; filt.Q.value = q;
    src.connect(filt); filt.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    src.start(when); src.stop(when + dur + 0.02);
  }
  return { ac, tone, sweep, noise };
})();

function playGreenGate(op) {
  const t = Sound.ac().currentTime;
  if (op === 'x') {

}
function playRedGate(op) {

// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════
//  LEVEL GENERATION
// ═══════════════════════════════════════════════
function gateValue(gate) {
  // numeric "goodness" of a gate at current count
  const { op, v } = gate;
  if (op === 'x') return count * v - count;
  if (op === '+') return v;
  if (op === '-') return -v;
  if (op === '/') return -(count - Math.ceil(count / v));
  return 0;
}

const isSteal = g => g.op === 'steal' || g.op === 'half';
function isGoodGate(gate) {
  const { op, v } = gate;
  if (op === 'x' || op === '+') return true;
  return false;
}

function gateLabel(gate) {
  if (gate.op === 'steal') return 'STEAL ' + gate.v + '%';
  if (gate.op === 'half') return 'TOP ÷2';
  const sym = { 'x':'×', '+':'+', '-':'−', '/':'÷' };
  return sym[gate.op] + gate.v;
}

function buildLevel(lvl, rng = Math.random) {
  objects = [];
  const cfg = LEVEL_CFG[Math.min(lvl - 1, LEVEL_CFG.length - 1)];
  scrollSpeed = cfg.speed + (lvl > LEVEL_CFG.length ? (lvl - LEVEL_CFG.length) * 0.15 : 0);

  const gateCount = 10 + Math.min(lvl - 1, 5);
  const spacing = 200; // fixed 200px gap between each gate
  levelLength = 600 + gateCount * spacing; // level grows to fit all gates

  // Shuffle gate pairs for this level
  const shuffled = [...GATE_PAIRS].map(g => [rng(), g]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

  for (let i = 0; i < gateCount; i++) {
    const dist = 300 + i * spacing;
    const pair = shuffled[i % shuffled.length];

    // Randomize which side is good/bad
    const flip = rng() < 0.5;
    const left  = flip ? pair[0] : pair[1];
    const right = flip ? pair[1] : pair[0];

    objects.push({ type: 'gate', dist, left, right, triggered: false });

    // Occasional obstacle between gates (less frequent with more gates)
    if (i < gateCount - 1 && rng() < 0.25) {
      objects.push({ type: 'obstacle', dist: dist + spacing * 0.6, side: rng() < 0.5 ? 'left' : 'right', triggered: false });
    }
  }

  // Enemy at end
  const eCount = cfg.enemyCount + (lvl > LEVEL_CFG.length ? (lvl - LEVEL_CFG.length) * 150 : 0);
  objects.push({ type: 'enemy', dist: levelLength - 180, count: eCount, triggered: false });
}

function initGame(keepCount = false) {

  if (level > 1) saveProgress(); // save current level so Continue resumes exactly here
  const cfg = LEVEL_CFG[Math.min(level - 1, LEVEL_CFG.length - 1)];
  if (!keepCount) count = cfg.startCount || count;
  crowdX = 0;
  targetX = 0;
  levelProgress = 0;
  gameState = 'running';
  savedGameState = null;
  setPauseBtnText(false);
  frame = 0;
  floats = [];
  sparks = [];
  buildLevel(level);
  updateUI();
  requestAnimationFrame(loop);
}

function applyGate(gate) {
  const prev = count;
  const { op, v } = gate;
  if (isSteal(gate)) { if (window.Race) Race.onSteal(gate); updateUI(); return; }
  if (op === 'x') count = Math.max(1, count * v);
  else if (op === '+') count = count + v;
  else if (op === '-') count = Math.max(1, count - v);
  else if (op === '/') count = Math.max(1, Math.ceil(count / v));
  isGoodGate(gate) ? playGreenGate(op) : playRedGate(op);

  const diff = count - prev;
  const label = (diff >= 0 ? '+' : '') + diff;
  const color = diff >= 0 ? '#4ade80' : '#f87171';
  const sx = VP_X + crowdX;   // screen X of player crowd
  floats.push({ x: sx, y: CROWD_Y - 50, text: label, color, life: 1 });

  // Sparks
  for (let i = 0; i < 12; i++) {
    const ang = Math.random() * Math.PI * 2;
    sparks.push({ x: sx, y: CROWD_Y - 20, vx: Math.cos(ang) * (1 + Math.random() * 3), vy: Math.sin(ang) * (1 + Math.random() * 3) - 1, color, life: 1 });
  }

  updateUI();
}

function updateUI() {
  document.getElementById('countDisplay').textContent = count.toLocaleString();
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('scoreDisplay').textContent = score.toLocaleString();
  const eObj = objects.find(o => o.type === 'enemy');
  if (eObj && gameState !== 'battle') {
    document.getElementById('enemyDisplay').textContent = eObj.count.toLocaleString();
  }
}

// ═══════════════════════════════════════════════
//  STICKMAN DRAW
// ═══════════════════════════════════════════════
function drawStickman(x, y, animFrame, color, scale = 1) {
  const s = scale;
  const lA = Math.sin(animFrame * 0.35) * 0.9;
  const rA = -lA;
  const aA = Math.sin(animFrame * 0.35 + Math.PI) * 0.55;

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 1.5 * s;
  ctx.lineCap = 'round';

  // Head
  ctx.beginPath();
  ctx.arc(x, y - 19 * s, 4 * s, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.beginPath();
  ctx.moveTo(x, y - 14 * s);
  ctx.lineTo(x, y - 5 * s);
  ctx.stroke();

  // Arms
  ctx.beginPath();
  ctx.moveTo(x, y - 12 * s);
  ctx.lineTo(x - 7 * s * Math.cos(aA), y - 12 * s + 6 * s * Math.sin(aA));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y - 12 * s);
  ctx.lineTo(x + 7 * s * Math.cos(aA), y - 12 * s - 6 * s * Math.sin(aA));
  ctx.stroke();

  // Legs
  ctx.beginPath();
  ctx.moveTo(x, y - 5 * s);
  ctx.lineTo(x + 7 * s * Math.sin(lA), y + 7 * s * Math.cos(Math.abs(lA)) - 5 * s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y - 5 * s);
  ctx.lineTo(x - 7 * s * Math.sin(rA), y + 7 * s * Math.cos(Math.abs(rA)) - 5 * s);
  ctx.stroke();

  ctx.restore();
}

// ═══════════════════════════════════════════════
//  CROWD DRAW
// ═══════════════════════════════════════════════
function drawCrowd(cx, cy, n, animFrame, color, crowdScale = 1) {
  const display = Math.min(n, MAX_STICKMEN);
  if (display === 0) return;

  const cols = Math.min(display, 8);
  const rows = Math.ceil(display / cols);
  const spacingX = 16 * crowdScale;
  const spacingY = 22 * crowdScale;
  const totalW = (cols - 1) * spacingX;
  const totalH = (rows - 1) * spacingY;
  const startX = cx - totalW / 2;
  const startY = cy - totalH;

  for (let i = 0; i < display; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = startX + col * spacingX + (row % 2 === 1 ? 8 * crowdScale : 0);
    const y = startY + row * spacingY;
    const af = animFrame + i * 3;
    drawStickman(x, y, af, color, crowdScale);
  }
}

// ═══════════════════════════════════════════════
//  COUNT BADGE
// ═══════════════════════════════════════════════
function drawCountBadge(x, y, n, color, bgColor) {
  const text = n.toLocaleString();
  ctx.font = 'bold 15px Segoe UI, system-ui, sans-serif';
  const tw = ctx.measureText(text).width;
  const pw = tw + 18, ph = 24;
  const bx = x - pw / 2, by = y - ph / 2;

  ctx.fillStyle = bgColor || 'rgba(0,0,0,0.7)';
  ctx.beginPath();
  ctx.roundRect(bx, by, pw, ph, 12);
  ctx.fill();

  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(bx, by, pw, ph, 12);
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

// ═══════════════════════════════════════════════
//  PERSPECTIVE PROJECTION
// ═══════════════════════════════════════════════
// worldX : offset from road centre (−ROAD_HW … +ROAD_HW)
// distAhead : world units ahead of the player (0 = at player, VIEW_DIST = horizon)
function proj(worldX, distAhead) {
  const t = Math.min(Math.max(distAhead / VIEW_DIST, 0), 1);
  const scale = 1 - t;
  return {
    x:     VP_X + worldX * scale,
    y:     VP_Y + (NEAR_Y - VP_Y) * scale,
    scale: scale
  };
}

// ═══════════════════════════════════════════════
//  DRAW ROAD
// ═══════════════════════════════════════════════
function drawRoad() {
  // ── Off-road grass (fill everything first) ──────
  ctx.fillStyle = '#0c170c';
  ctx.fillRect(0, 0, CW, CH);

  // ── Sky gradient ────────────────────────────────
  const sky = ctx.createLinearGradient(0, 0, 0, VP_Y + 80);
  sky.addColorStop(0,   '#060612');
  sky.addColorStop(0.5, '#0e0e22');
  sky.addColorStop(1,   '#181832');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, CW, VP_Y + 80);

  // ── Road trapezoid ───────────────────────────────
  const rg = ctx.createLinearGradient(VP_X, VP_Y, VP_X, NEAR_Y);
  rg.addColorStop(0,   '#141428');
  rg.addColorStop(0.4, '#1c1c35');
  rg.addColorStop(1,   '#1f1f3c');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.moveTo(VP_X,             VP_Y);
  ctx.lineTo(VP_X + ROAD_HW,  NEAR_Y);
  ctx.lineTo(VP_X - ROAD_HW,  NEAR_Y);
  ctx.closePath();
  ctx.fill();

  // ── Below near plane (player platform) ──────────
  ctx.fillStyle = '#0a0a18';
  ctx.fillRect(0, NEAR_Y, CW, CH - NEAR_Y);

  // ── Road edges (converging lines) ───────────────
  ctx.strokeStyle = '#3a3a60';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(VP_X, VP_Y); ctx.lineTo(VP_X - ROAD_HW, NEAR_Y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(VP_X, VP_Y); ctx.lineTo(VP_X + ROAD_HW, NEAR_Y); ctx.stroke();

  // ── Perspective centre dashes ────────────────────
  const dashCycle = 65;           // world units per dash on+off cycle
  const dashOnFrac = 0.42;
  const nDashes = Math.ceil(VIEW_DIST / dashCycle) + 2;
  const dashOff = levelProgress % dashCycle;
  for (let i = 0; i < nDashes; i++) {
    const d0 = i * dashCycle - dashOff;
    const d1 = d0 + dashCycle * dashOnFrac;
    const da = Math.max(d0, 1);
    const db = Math.min(d1, VIEW_DIST - 1);
    if (da >= db) continue;
    const pa = proj(0, da), pb = proj(0, db);
    const alpha = 0.07 + 0.18 * pb.scale;
    ctx.strokeStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
    ctx.lineWidth = Math.max(0.5, 2 * pb.scale);
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  }

  // ── Perspective trees / posts ────────────────────
  const postSpacing = 110;
  const nPosts = Math.ceil(VIEW_DIST / postSpacing) + 2;
  const postOff = levelProgress % postSpacing;
  for (let i = 0; i < nPosts; i++) {
    const dist = i * postSpacing - postOff;
    if (dist <= 1 || dist >= VIEW_DIST) continue;
    const p = proj(0, dist);
    const sc = p.scale;
    const tr = Math.max(2, 9 * sc);
    const lx = VP_X - ROAD_HW * sc - 18 * sc;
    const rx = VP_X + ROAD_HW * sc + 18 * sc;
    ctx.fillStyle = '#1a3a1a';
    ctx.beginPath(); ctx.arc(lx, p.y, tr + 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2d5a2d';
    ctx.beginPath(); ctx.arc(lx, p.y, tr - 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a3a1a';
    ctx.beginPath(); ctx.arc(rx, p.y, tr + 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2d5a2d';
    ctx.beginPath(); ctx.arc(rx, p.y, tr - 1, 0, Math.PI * 2); ctx.fill();
  }
}

// ═══════════════════════════════════════════════
//  DRAW GATE
// ═══════════════════════════════════════════════
function drawGate(obj, distAhead) {
  const p  = proj(0, distAhead);
  const sc = p.scale;
  if (sc <= 0.02) return;

  const roadW = ROAD_HW * sc;
  const gap   = Math.max(1.5, GATE_GAP * sc);
  const gw    = roadW - gap / 2;
  const gh    = GATE_H * sc;
  const lx    = VP_X - roadW;
  const rx    = VP_X + gap / 2;
  const topY  = p.y - gh;
  const botY  = p.y;
  const depth = 5 * sc;     // 3-D side depth

  function drawHalf(x, gate, good) {
    const st = isSteal(gate);
    const col     = st ? '#a855f7' : good ? '#22c55e' : '#ef4444';
    const colDark = st ? '#6b21a8' : good ? '#15803d' : '#b91c1c';
    const colGlow = st ? 'rgba(168,85,247,0.25)' : good ? 'rgba(34,197,94,0.18)' : 'rgba(239,68,68,0.18)';

    // Glow halo
    ctx.fillStyle = colGlow;
    ctx.beginPath();
    ctx.roundRect(x - 3 * sc, topY - 3 * sc, gw + 6 * sc, gh + 6 * sc, 8 * sc);
    ctx.fill();

    // 3-D top face
    ctx.fillStyle = colDark;
    ctx.beginPath();
    ctx.moveTo(x,             topY);
    ctx.lineTo(x + gw,        topY);
    ctx.lineTo(x + gw + depth, topY - depth);
    ctx.lineTo(x       + depth, topY - depth);
    ctx.closePath();
    ctx.fill();

    // Front face
    const fg = ctx.createLinearGradient(x, topY, x, botY);
    fg.addColorStop(0, col);
    fg.addColorStop(1, colDark);
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.roundRect(x, topY, gw, gh, 4 * sc);
    ctx.fill();

    // 3-D right-side face
    ctx.fillStyle = colDark;
    ctx.beginPath();
    ctx.moveTo(x + gw,         topY);
    ctx.lineTo(x + gw + depth, topY - depth);
    ctx.lineTo(x + gw + depth, botY - depth);
    ctx.lineTo(x + gw,         botY);
    ctx.closePath();
    ctx.fill();

    // Shine strip
    const sh = Math.min(10 * sc, gh * 0.25);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.roundRect(x + 2 * sc, topY + 2 * sc, gw - 4 * sc, sh, 3 * sc);
    ctx.fill();

    // Label
    const fs = Math.max(9, Math.round((st ? 15 : 22) * sc));
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${fs}px Segoe UI, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 3;
    ctx.fillText(gateLabel(gate), x + gw / 2, topY + gh / 2);
    ctx.shadowBlur = 0;
  }

  drawHalf(lx, obj.left,  isGoodGate(obj.left));
  drawHalf(rx, obj.right, isGoodGate(obj.right));
}

// ═══════════════════════════════════════════════
//  DRAW OBSTACLE
// ═══════════════════════════════════════════════
function drawObstacle(obj, distAhead) {
  const p  = proj(0, distAhead);
  const sc = p.scale;
  if (sc <= 0.02) return;

  const roadW = ROAD_HW * sc;
  const wallW = roadW;          // one half of road
  const gapW  = roadW;          // the other half
  const oh    = OBS_H * sc;
  const topY  = p.y - oh;
  const botY  = p.y;

  let wallX, gapX;
  if (obj.side === 'left') {
    wallX = VP_X - roadW;
    gapX  = VP_X;
  } else {
    wallX = VP_X;
    gapX  = VP_X - roadW;
  }

  // Wall body
  const wg = ctx.createLinearGradient(0, topY, 0, botY);
  wg.addColorStop(0, '#7c1d1d');
  wg.addColorStop(1, '#450a0a');
  ctx.fillStyle = wg;
  ctx.beginPath();
  ctx.roundRect(wallX, topY, wallW, oh, 4 * sc);
  ctx.fill();

  // Spikes
  ctx.fillStyle = '#ef4444';
  const spikeCount = Math.max(2, Math.floor(wallW / (14 * sc)));
  for (let i = 0; i < spikeCount; i++) {
    const sx = wallX + (i + 0.5) * (wallW / spikeCount);
    const sw = 4 * sc, sh = 8 * sc;
    ctx.beginPath();
    ctx.moveTo(sx - sw, topY);
    ctx.lineTo(sx + sw, topY);
    ctx.lineTo(sx,      topY - sh);
    ctx.closePath();
    ctx.fill();
  }

  // SAFE lane highlight
  ctx.fillStyle = 'rgba(34,197,94,0.2)';
  ctx.beginPath();
  ctx.roundRect(gapX, topY, gapW, oh, 4 * sc);
  ctx.fill();
  const fs = Math.max(7, Math.round(11 * sc));
  ctx.fillStyle = '#4ade80';
  ctx.font = `bold ${fs}px Segoe UI, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(SillyI18n.en('safe'), gapX + gapW / 2, topY + oh / 2);
}

// ═══════════════════════════════════════════════
//  DRAW ENEMY CROWD
// ═══════════════════════════════════════════════
function drawEnemyCrowd(distAhead, n, animFrame) {
  if (n <= 0) return;
  const p  = proj(0, distAhead);
  const sc = p.scale;
  if (sc <= 0.02) return;

  const roadW = ROAD_HW * sc;
  const lx    = VP_X - roadW + 8 * sc;
  const rw    = roadW * 2 - 16 * sc;
  const bh    = 70 * sc;

  // Backdrop
  ctx.fillStyle = 'rgba(239,68,68,0.12)';
  ctx.beginPath();
  ctx.roundRect(lx, p.y - bh, rw, bh, 6 * sc);
  ctx.fill();
  ctx.strokeStyle = 'rgba(239,68,68,0.4)';
  ctx.lineWidth = Math.max(0.5, 1.5 * sc);
  ctx.beginPath();
  ctx.roundRect(lx, p.y - bh, rw, bh, 6 * sc);
  ctx.stroke();

  drawCrowd(p.x, p.y - 10 * sc, n, animFrame, '#f87171', sc);
  drawCountBadge(p.x, p.y + 20 * sc, n, '#f87171', 'rgba(30,5,5,0.85)');
}

// ═══════════════════════════════════════════════
//  DRAW FINISH BANNER
// ═══════════════════════════════════════════════
function drawFinish(distAhead) {
  const p  = proj(0, distAhead);
  const sc = p.scale;
  if (sc <= 0.02) return;
  const roadW = ROAD_HW * sc;
  const lx    = VP_X - roadW;
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(lx, p.y - 3 * sc, roadW * 2, Math.max(2, 5 * sc));
  ctx.fillStyle = 'rgba(251,191,36,0.15)';
  ctx.fillRect(lx, p.y - 35 * sc, roadW * 2, 35 * sc);
  const fs = Math.max(8, Math.round(13 * sc));
  ctx.fillStyle = '#fbbf24';
  ctx.font = `bold ${fs}px Segoe UI, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(SillyI18n.en('battleZone'), VP_X, p.y - 20 * sc);
}

// ═══════════════════════════════════════════════
//  BATTLE SCREEN
// ═══════════════════════════════════════════════
function drawBattle() {
  const t = bTimer / bDuration;
  const t2 = Math.min(t * 1.5, 1); // faster visual change

  const playerN = bResult === 'win'
    ? Math.ceil(bPlayerStart - (bPlayerStart - (bPlayerStart - bEnemyStart)) * t2)
    : Math.max(0, Math.ceil(bPlayerStart * (1 - t2)));
  const enemyN  = bResult === 'win'
    ? Math.max(0, Math.ceil(bEnemyStart * (1 - t2)))
    : Math.ceil(bEnemyStart - (bEnemyStart - (bEnemyStart - bPlayerStart)) * t2);

  // Battle bg
  ctx.fillStyle = '#0a0a18';
  ctx.fillRect(0, 0, CW, CH);
  ctx.fillStyle = 'rgba(239,68,68,0.06)';
  ctx.fillRect(ROAD_L, 0, ROAD_W, CH / 2);
  ctx.fillStyle = 'rgba(34,197,94,0.06)';
  ctx.fillRect(ROAD_L, CH / 2, ROAD_W, CH / 2);

  // Divider
  ctx.strokeStyle = '#3a3a60';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 6]);
  ctx.beginPath();
  ctx.moveTo(ROAD_L, CH / 2);
  ctx.lineTo(ROAD_R, CH / 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // VS text
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 22px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⚔️', ROAD_MID, CH / 2);

  // Enemy crowd (top half)
  const enemyY = CH / 4 + 30;
  drawCrowd(ROAD_MID, enemyY, enemyN, frame, '#f87171');
  drawCountBadge(ROAD_MID, enemyY + 40, Math.max(0, enemyN), '#f87171');

  // Player crowd (bottom half)
  const playerY = CH * 3 / 4 - 10;
  drawCrowd(ROAD_MID, playerY, playerN, frame, '#4ade80');
  drawCountBadge(ROAD_MID, playerY + 40, Math.max(0, playerN), '#4ade80');

  // Labels
  ctx.font = 'bold 13px Segoe UI, sans-serif';
  ctx.textBaseline = 'top';

  ctx.fillStyle = '#f87171';
  ctx.textAlign = 'left';
  ctx.fillText(SillyI18n.en('enemyCv'), ROAD_L + 10, 12);

  ctx.fillStyle = '#4ade80';
  ctx.textAlign = 'left';
  ctx.fillText(SillyI18n.en('yourArmyCv'), ROAD_L + 10, CH / 2 + 12);

  // Impact sparks
  if (t > 0.05 && t < 0.6) {
    ctx.save();
    const sparkY = CH / 2 + Math.sin(frame * 0.5) * 20;
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(ROAD_MID, sparkY, 5 + Math.sin(frame * 0.8) * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════
//  MAIN UPDATE
// ═══════════════════════════════════════════════
function update() {
  frame++;
  dashOffset = (dashOffset + scrollSpeed * 0.6) % 48;

  // Lerp crowd X (world units, centred on VP_X)
  const lerpSpeed = 0.14;
  crowdX += (targetX - crowdX) * lerpSpeed;
  crowdX = Math.max(-(ROAD_HW - 20), Math.min(ROAD_HW - 20, crowdX));

  // Arrow key input
  if (keys['ArrowLeft'])  targetX = Math.max(-(ROAD_HW - 20), targetX - 5);
  if (keys['ArrowRight']) targetX = Math.min(ROAD_HW - 20, targetX + 5);

  // Progress (online race also counts steps for the live board)
  if (window.Race && Race.active) { Race.frames++; if (Race.stun > 0) Race.stun--; else levelProgress += scrollSpeed; }
  else levelProgress += scrollSpeed;

  // Update objects
  objects.forEach(obj => {
    if (obj.triggered) return;
    const distAhead = obj.dist - levelProgress;

    if (obj.type === 'gate' && distAhead <= 30) {
      obj.triggered = true;
      const choseLeft = crowdX < 0;   // world X: negative = left half of road
      const gate = choseLeft ? obj.left : obj.right;
      applyGate(gate);
    }

    if (obj.type === 'obstacle' && distAhead <= 30) {
      obj.triggered = true;
      // Check if crowd is on the wall side
      const onLeft     = crowdX < 0;
      const wallOnLeft = obj.side === 'left';
      if (onLeft === wallOnLeft) {
        // Hit the wall
        playObstacleHit();
        const lost = Math.max(1, Math.floor(count * 0.25));
        count = Math.max(1, count - lost);
        const sx = VP_X + crowdX;
        floats.push({ x: sx, y: CROWD_Y - 50, text: `−${lost}`, color: '#f87171', life: 1 });
        for (let i = 0; i < 15; i++) {
          const ang = Math.random() * Math.PI * 2;
          sparks.push({ x: sx, y: CROWD_Y - 20, vx: Math.cos(ang) * (1 + Math.random() * 4), vy: Math.sin(ang) * (1 + Math.random() * 4) - 1, color: '#f87171', life: 1 });
        }
        updateUI();
      }
    }

    if (obj.type === 'finish' && distAhead <= 80) {
      obj.triggered = true;
      Race.finish();
    }

    if (obj.type === 'enemy' && distAhead <= 80) {
      obj.triggered = true;
      startBattle(obj.count);
    }
  });

  // Update floating texts
  floats = floats.filter(f => f.life > 0);
  floats.forEach(f => { f.y -= 1.2; f.life -= 0.03; });

  // Update sparks
  sparks = sparks.filter(s => s.life > 0);
  sparks.forEach(s => { s.x += s.vx; s.y += s.vy; s.vy += 0.15; s.life -= 0.06; });
}

function startBattle(eCount) {
  playBattleStart();
  gameState = 'battle';
  bPlayerCount = count;
  bEnemyCount = eCount;
  bPlayerStart = count;
  bEnemyStart = eCount;
  bTimer = 0;
  bDuration = 90 + Math.floor(Math.min(bPlayerStart, bEnemyStart) * 0.3);
  bResult = bPlayerStart >= bEnemyStart ? 'win' : 'lose';
  document.getElementById('enemyDisplay').textContent = eCount.toLocaleString();
}

function updateBattle() {
  frame++;
  bTimer++;

  if (bTimer >= bDuration) {
    if (bResult === 'win') {
      count = bPlayerStart - bEnemyStart;
      score += bEnemyStart * 10 + Math.floor(count * 2);
      setTimeout(() => showLevelWon(), 400);
    } else {
      count = 0;
      setTimeout(() => showGameOver(), 400);
    }
    gameState = 'idle';
  }
}

let lastResult = null;
function renderResultText() {
  if (!lastResult) return;
  const t = SillyI18n.t, won = lastResult === 'won';
  document.getElementById('resultTitle').textContent    = won ? t('levelClear') : t('defeated');
  document.getElementById('resultSubtitle').textContent = won ? t('defeatedWith', count) : t('outnumbered');
  document.getElementById('finalScore').textContent     = score.toLocaleString();
  document.getElementById('resultDetail').textContent   = won ? t('levelDone', level) : t('reached', level, score.toLocaleString());
}
SillyI18n.onChange(() => {
  renderResultText();
  document.getElementById('pauseBtn').textContent = (typeof gameState !== 'undefined' && gameState === 'paused') ? SillyI18n.t('resume') : SillyI18n.t('pause');
  if (document.getElementById('continueBtn').style.display === 'none' && typeof gameState !== 'undefined' && gameState === 'paused')
    document.getElementById('startBtn').textContent = SillyI18n.t('resumeGame');
  else try { updateStartPanel(); } catch (e) {}
});

function showLevelWon() {
  playVictory();
  gameState = 'levelWon';
  lastResult = 'won';
  renderResultText();

  const hasNextLevel = true; // infinite levels
  document.getElementById('resultContinueBtn').style.display = hasNextLevel ? 'inline-flex' : 'none';
  document.getElementById('resultOverlay').classList.add('active');
  updateUI();
}

function showGameOver() {
  playDefeat();
  gameState = 'gameOver';
  lastResult = 'lost';
  renderResultText();
  document.getElementById('resultContinueBtn').style.display = 'none';
  document.getElementById('resultOverlay').classList.add('active');
}

// ═══════════════════════════════════════════════
//  DRAW RUNNING PHASE
// ═══════════════════════════════════════════════
function drawRunning() {
  drawRoad();

  const animFrame = Math.floor(frame / (60 / ANIM_FPS));

  // Collect visible objects and sort far → near (painter's algorithm)
  const visibles = objects
    .filter(obj => {
      const d = obj.dist - levelProgress;
      return !obj.triggered && d > 0 && d < VIEW_DIST + 60;
    })
    .sort((a, b) => (b.dist - levelProgress) - (a.dist - levelProgress));

  // Draw finish banner (just before enemy)
  const enemyObj = objects.find(o => o.type === 'enemy' || o.type === 'finish');
  if (enemyObj) {
    const fDist = (enemyObj.dist - 80) - levelProgress;
    if (fDist > 1 && fDist < VIEW_DIST) drawFinish(fDist);
  }

  // Draw objects
  visibles.forEach(obj => {
    const distAhead = obj.dist - levelProgress;
    if (obj.type === 'gate')     drawGate(obj, distAhead);
    if (obj.type === 'obstacle') drawObstacle(obj, distAhead);
    if (obj.type === 'enemy')    drawEnemyCrowd(distAhead, obj.count, animFrame);
  });

  // Player crowd (always at near plane)
  const playerSX = VP_X + crowdX;
  ctx.fillStyle = 'rgba(106,220,255,0.08)';
  ctx.beginPath();
  ctx.ellipse(playerSX, NEAR_Y + 4, Math.min(count * 2 + 20, 80), 10, 0, 0, Math.PI * 2);
  ctx.fill();
  drawCrowd(playerSX, NEAR_Y, count, animFrame, '#e2e8f0');
  drawCountBadge(playerSX, NEAR_Y + 28, count, '#06b6d4', 'rgba(5,20,40,0.85)');

  // Floating texts
  floats.forEach(f => {
    ctx.globalAlpha = f.life;
    ctx.fillStyle = f.color;
    ctx.font = 'bold 20px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  });

  // Sparks
  sparks.forEach(s => {
    ctx.globalAlpha = s.life * 0.8;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Progress bar
  const pct = Math.min(levelProgress / (levelLength - 100), 1);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.roundRect(ROAD_L, CH - 12, ROAD_W, 7, 3);
  ctx.fill();
  const barGrad = ctx.createLinearGradient(ROAD_L, 0, ROAD_R, 0);
  barGrad.addColorStop(0, '#7c3aed');
  barGrad.addColorStop(1, '#06b6d4');
  ctx.fillStyle = barGrad;
  ctx.beginPath();
  ctx.roundRect(ROAD_L, CH - 12, ROAD_W * pct, 7, 3);
  ctx.fill();

  // HUD
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '10px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(window.Race && Race.active ? `RACE ${Race.race} / 3` : SillyI18n.en('lvl', level), VP_X, CH - 14);
  if (window.Race && Race.active) Race.drawOverlay();
}

// ═══════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════
let lastTs = 0, stepAcc = 0;
const STEP = 1000 / 60;
function loop(ts) {
  if (gameState !== 'running' && gameState !== 'battle') { lastTs = 0; return; }
  ts = ts || performance.now();
  stepAcc += lastTs ? Math.min(250, ts - lastTs) : STEP;
  lastTs = ts;
  while (stepAcc >= STEP) {
    stepAcc -= STEP;
    if (gameState === 'running') update();
    else if (gameState === 'battle') updateBattle();
    else break;
  }
  if (gameState === 'running') drawRunning();
  else if (gameState === 'battle') drawBattle();
  if (gameState === 'running' || gameState === 'battle') requestAnimationFrame(loop); else lastTs = 0;
}

// ═══════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  mouseX = x - VP_X;   // world X relative to centre
  targetX = Math.max(-(ROAD_HW - 20), Math.min(ROAD_HW - 20, mouseX));
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  targetX = Math.max(-(ROAD_HW - 20), Math.min(ROAD_HW - 20, x - VP_X));
}, { passive: false });

document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup',   e => { keys[e.code] = false; });

// ═══════════════════════════════════════════════
//  PAUSE
// ═══════════════════════════════════════════════
function setPauseBtnText(paused) {
  document.getElementById('pauseBtn').textContent = paused ? SillyI18n.t('resume') : SillyI18n.t('pause');
  document.getElementById('pauseBadge').classList.toggle('visible', paused);
}

function togglePause() {
  if (gameState === 'running' || gameState === 'battle') {
    savedGameState = gameState;
    gameState = 'paused';
    setPauseBtnText(true);
  } else if (gameState === 'paused') {
    gameState = savedGameState;
    savedGameState = null;
    setPauseBtnText(false);
    requestAnimationFrame(loop);
  }
}

// ═══════════════════════════════════════════════
//  UI EVENTS
// ═══════════════════════════════════════════════
document.getElementById('pauseBtn').addEventListener('click', togglePause);

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startOverlay').classList.remove('active');
  if (savedGameState !== null) {
    gameState = savedGameState; // restore 'running' or 'battle'
    savedGameState = null;
    setPauseBtnText(false);
    requestAnimationFrame(loop); // restart the stopped loop
  } else {
    clearSaveProgress();
    level = 1;
    score = 0;
    count = 10;
    initGame();
  }

  const key = r.round + ':' + st.race + ':' + st.seed;
  if (st.phase === 'run' && key !== Race.key) {
    Race.key = key; Race.round = r.round; Race.race = st.race; Race.seed = st.seed;
    Race.applied = new Set(); Race.cpus = {}; Race.raceStartAt = 0; Race.done = false;
    document.getElementById('raceOverlay').classList.remove('active');
    countdown();
  } else if (st.phase === 'result' && Race.resultKey !== key) {
    Race.resultKey = key; Race.resultSeenAt = Date.now();
    Race.active = false; if (gameState === 'running') gameState = 'idle';
    showRaceResult(st, false);
  } else if (st.phase === 'done' && Race.resultKey !== key + ':done') {
    Race.resultKey = key + ':done';
    Race.active = false; if (gameState === 'running') gameState = 'idle';
    showRaceResult(st, true);
  }
  renderBoard();
}
function raceExit() {
  clearInterval(Race.countdownTimer); clearInterval(Race.hostTimer); clearInterval(Race.nextTimer);
  Race.hostTimer = null; if (Race.unLive) Race.unLive(); Race.unLive = null;
  Object.assign(Race, { online: false, active: false, done: false, race: 0, key: '', resultKey: '', cpus: {}, live: {} });
  document.body.classList.remove('racing');
  document.getElementById('raceOverlay').classList.remove('active');
  gameState = 'idle';
  drawRoad(); drawCrowd(VP_X, CROWD_Y, 10, 0, '#e2e8f0');
  updateStartPanel();
  document.getElementById('startOverlay').classList.add('active');
}
async function raceLeave() {
  await SillyOnline.leave();      // the live doc stays, so the race can still count my last army
}
let toastT = null;
function toast(msg) {
  const el = document.getElementById('raceToast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

SillyOnline.mount({
  game: 'count-masters',
  title: { zh: '人海大作戰', en: 'Count Masters' },
  seats: 2,
  seatCounts: [2, 3, 4],
  defaultSeats: () => 2,
  seatLabel: (i, l) => (l === 'zh' ? ['藍', '橘', '紫', '紅'] : ['Blue', 'Orange', 'Purple', 'Red'])[i],
  seatColor: i => RACE_COLORS[i],
  cpuLevels: ['easy', 'medium', 'hard'],
  newState: () => ({ race: 1, seed: (Math.random() * 2 ** 31) | 0, phase: 'run', results: {}, points: {}, sums: {} }),
  onRoom: r => onRoom(r),
  onExit: () => raceExit(),
  onCancelEntry: () => document.getElementById('startOverlay').classList.add('active'),
});

document.getElementById('onlineBtn').addEventListener('click', () => {
  document.getElementById('startOverlay').classList.remove('active');
  SillyOnline.openEntry();
});
document.getElementById('raceAgainBtn').addEventListener('click', () => { if (SillyOnline.isHost()) SillyOnline.rematch(); });
document.getElementById('raceCloseBtn').addEventListener('click', () => document.getElementById('raceOverlay').classList.remove('active'));
document.getElementById('raceLeaveBtn').addEventListener('click', () => raceLeave());
// leaving during an online race
document.getElementById('exitBtn').addEventListener('click', async e => {
  if (!Race.online) return;
  e.stopImmediatePropagation();
  if (!confirm(SillyI18n.lang === 'zh' ? '確定要離開房間嗎？' : 'Leave the room?')) return;
  await raceLeave(); window.location.href = '../../';
}, true);
SillyI18n.onChange(() => {
  if (!Race.online) return;
  renderBoard();
  const st = room() && room().state;
  if (st && document.getElementById('raceOverlay').classList.contains('active')) showRaceResult(st, st.phase === 'done');
});
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../shared/firebase.js"></script>
<script>
if ((() => { try { return typeof SillyFirebase !== 'undefined'; } catch (e) { return false; } })()) {
SillyFirebase.renderAvatarFromCacheDisplay('game-avatar');

// Pre-load savedLevel from cached uid — shows Continue immediately, no pop-in
(function() {
  try {
    const cached = JSON.parse(localStorage.getItem('_sfAvatarCache'));
    if (cached && cached.uid) {
      const userSave = JSON.parse(localStorage.getItem(`countMasters_save_${cached.uid}`));
      if (userSave && userSave.level > 1) {
        savedLevel = userSave.level;
        updateStartPanel();
      }
    }
  } catch(e) {}
})();

SillyFirebase.onAuthChanged(async user => {
  SillyFirebase.renderAvatarDisplay('game-avatar', user);
  if (user) {
    const userSaveKey = `countMasters_save_${user.uid}`;
    const cloud = await SillyFirebase.loadProgress('countMasters');
    let userLocal = null;
    try { userLocal = JSON.parse(localStorage.getItem(userSaveKey)); } catch(e) {}

    let best = null;
    if (cloud && userLocal) {
      best = (cloud.savedAt || 0) >= (userLocal.savedAt || 0) ? cloud : userLocal;
    } else {
      best = cloud || userLocal;
    }
    if (best) {
      savedLevel = best.level || 0;
      const stamped = { ...best, uid: user.uid };
      localStorage.setItem(CM_SAVE_KEY, JSON.stringify(stamped));
      localStorage.setItem(userSaveKey, JSON.stringify(stamped));
      if (userLocal && (!cloud || (userLocal.savedAt || 0) > (cloud.savedAt || 0))) {
        await SillyFirebase.saveProgress('countMasters', userLocal);
      }
    } else {
      savedLevel = 0;
    }
    if (gameState === 'idle') updateStartPanel();
  } else {
    localStorage.removeItem(CM_SAVE_KEY);
    savedLevel = 0;
    try {
      const sess = JSON.parse(sessionStorage.getItem(CM_GUEST_KEY));
      if (sess && !sess.uid) savedLevel = sess.level || 0;
    } catch(e) {}
    if (gameState === 'idle') updateStartPanel();
  }
});
}
</script>
