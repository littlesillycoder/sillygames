<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ping Pong</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d1a; --surface: #14142b; --border: #2a2a50;
      --accent: #7c3aed; --accent2: #06b6d4; --text: #e2e8f0; --muted: #64748b;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; user-select: none;
    }
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 1.5rem; height: 54px; display: flex; align-items: center; gap: 1rem;
    }
    .topbar .brand { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; }
    .topbar .brand a { color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
    .topbar .brand a:hover { color: var(--text); }
    .topbar .sep { color: var(--muted); }
    .topbar-actions { margin-left: auto; display: flex; gap: 0.6rem; align-items: center; }
    .btn {
      padding: 0.45rem 1rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.85; transform: scale(1.02); }
    .btn:active { transform: scale(0.97); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--accent); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #5b21b6); color: #fff; }
    .btn-danger { background: linear-gradient(135deg, #dc2626, #991b1b); color: #fff; }

    .sound-toggle {
      background: transparent; border: 1px solid var(--border); color: var(--text);
      padding: 0.4rem 0.7rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
      transition: border-color 0.2s;
    }
    .sound-toggle:hover { border-color: var(--accent2); }
    .sound-toggle.muted { opacity: 0.4; }

    .game-wrapper {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; gap: 1.5rem;
    }
    .sidebar {
      display: flex; flex-direction: column; gap: 1rem; width: 130px;
    }
    .stat-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.9rem;
    }
    .stat-label {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); margin-bottom: 0.3rem;
    }
    .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--accent2); font-variant-numeric: tabular-nums; }
    .stat-value.red { color: #f87171; }

    canvas {
      display: block; border-radius: 12px;
      box-shadow: 0 0 40px rgba(124,58,237,0.3), 0 0 80px rgba(6,182,212,0.1);
      cursor: none;
    }

    /* ── OVERLAY ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .overlay.active { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 2rem; max-width: 420px; width: 90%;
      text-align: center;
    }
    .modal-icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .modal h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    .modal p { color: var(--muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.2rem; }
    .modal .controls-grid {
      display: grid; grid-template-columns: auto 1fr; gap: 0.4rem 1rem;
      text-align: left; margin-bottom: 1.4rem;
    }
    .controls-grid .key {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.25rem 0.6rem; font-size: 0.8rem; font-weight: 700; color: var(--accent2);
      white-space: nowrap; text-align: center;
    }
    .controls-grid .desc { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; }
    .modal-btns { display: flex; gap: 0.75rem; justify-content: center; }
    .modal-btns .btn { min-width: 130px; }

    /* Pause badge */
    .pause-badge {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.8); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.6rem 1.4rem;
      font-size: 1rem; font-weight: 700; color: var(--text);
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .pause-badge.visible { opacity: 1; }
    .canvas-wrap { position: relative; }

    /* Difficulty pills */
    .diff-pills { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.2rem; }
    .diff-pill {
      padding: 0.3rem 0.9rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; border: 2px solid transparent; transition: all 0.2s;
      background: var(--bg); color: var(--muted);
    }
    .diff-pill:hover { border-color: var(--accent); color: var(--text); }
    .diff-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    #game-avatar{display:flex;align-items:center;margin-left:0.5rem;}
  </style>

    youWinMatch: 'You Win the Match!', cpuWins: 'CPU Wins!',
    wonSub: (a, b) => `You won ${a}–${b}. Excellent table tennis!`, lostSub: (a, b) => `CPU won ${a}–${b}. Better luck next time!`,

<script>
// ═══════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════
const CW = 420, CH = 580;
const PADDLE_W = 12, PADDLE_H = 70;
const BALL_R = 8;
const POINTS_PER_SET = 7;
const SETS_TO_WIN = 2;

// ═══════════════════════════════════════════════
//  SOUND ENGINE
// ═══════════════════════════════════════════════
let soundEnabled = true;
const Sound = (() => {
  let _ac = null;
  function ac() {
    if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if (_ac.state === 'suspended') _ac.resume();
    return _ac;
  }
  function tone(freq, type, when, dur, vol = 0.2) {
    if (!soundEnabled) return;
    const c = ac(), osc = c.createOscillator(), g = c.createGain();
    osc.connect(g); g.connect(c.destination);
    osc.type = type; osc.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(0.001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    osc.start(when); osc.stop(when + dur + 0.02);
  }
  function noise(when, dur, vol = 0.1, hz = 800) {
    if (!soundEnabled) return;
    const c = ac();
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1);
    const src = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
    flt.type = 'bandpass'; flt.frequency.value = hz; flt.Q.value = 2;
    src.buffer = buf; src.connect(flt); flt.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    src.start(when); src.stop(when + dur + 0.02);
  }
  return { tone, noise, now: () => ac().currentTime };
})();

function playPaddleHit(speed) {
  const t = Sound.now();
  const freq = 300 + speed * 20;
  Sound.tone(freq, 'square', t, 0.06, 0.18);
  Sound.tone(freq * 1.5, 'sine', t, 0.04, 0.08);
}
function playWallHit() {
  const t = Sound.now();
  Sound.tone(200, 'sawtooth', t, 0.05, 0.1);
}
function playScore(playerScored) {
  const t = Sound.now();
  if (playerScored) {
    Sound.tone(523, 'sine', t,       0.12, 0.25);
    Sound.tone(659, 'sine', t + 0.1, 0.12, 0.25);
    Sound.tone(784, 'sine', t + 0.2, 0.18, 0.3);
  } else {
    Sound.tone(330, 'triangle', t,       0.1, 0.2);
    Sound.tone(277, 'triangle', t + 0.1, 0.12, 0.2);
    Sound.tone(220, 'triangle', t + 0.2, 0.18, 0.2);
  }
}
function playWin() {
  const t = Sound.now();
  [523,659,784,1047].forEach((f,i) => Sound.tone(f,'sine',t+i*0.12,0.2,0.3));
}
function playLose() {
  const t = Sound.now();
  [330,294,262,220].forEach((f,i) => Sound.tone(f,'sawtooth',t+i*0.12,0.2,0.25));
}

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let gameState = 'idle'; // idle | running | scored | paused | setOver | matchOver
let savedGameState = null;

let playerY = CH / 2 - PADDLE_H / 2;
let aiY     = CH / 2 - PADDLE_H / 2;
let targetPlayerY = playerY;

let ballX = CW / 2, ballY = CH / 2;
let ballVX = 0, ballVY = 0;
let rallyCount = 0;

let playerPoints = 0, aiPoints = 0;
let playerSets = 0, aiSets = 0;
let currentSet = 1;

let scoreFlash = { active: false, color: '#fff', life: 0 };
let sparks = [];
let particles = [];
let frame = 0;

let aiDifficulty = 'easy'; // easy | medium | hard
const AI_SPEED = { easy: 2.5, medium: 4.2, hard: 6.5 };
const AI_REACT  = { easy: 0.45, hard: 0.9, medium: 0.7 };  // prediction accuracy

// Keys
const keys = {};

// ═══════════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ═══════════════════════════════════════════════
//  BALL LAUNCH
// ═══════════════════════════════════════════════
function launchBall(towardPlayer = null) {
  ballX = CW / 2; ballY = CH / 2;
  const dir = (towardPlayer === null) ? (Math.random() < 0.5 ? 1 : -1) : (towardPlayer ? 1 : -1);
  const speed = 4.5 + currentSet * 0.3;
  const angle = (Math.random() - 0.5) * Math.PI * 0.5;
  ballVX = dir * speed * Math.cos(angle);
  ballVY = speed * Math.sin(angle);
  rallyCount = 0;
}

// ═══════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════
function update() {
  frame++;

  // Player paddle
  const spd = 7;
  if (keys['ArrowUp']   || keys['KeyW']) targetPlayerY -= spd;
  if (keys['ArrowDown'] || keys['KeyS']) targetPlayerY += spd;
  targetPlayerY = Math.max(0, Math.min(CH - PADDLE_H, targetPlayerY));
  playerY += (targetPlayerY - playerY) * 0.3;
  playerY = Math.max(0, Math.min(CH - PADDLE_H, playerY));

  // AI paddle
  const aiReact = AI_REACT[aiDifficulty];
  const aiSpeed = AI_SPEED[aiDifficulty];
  // Predict where ball will be when it reaches AI paddle
  let predictY = ballY;
  if (ballVX > 0) {
    const timeToReach = (CW - PADDLE_W - 20 - ballX) / Math.max(ballVX, 1);
    predictY = ballY + ballVY * timeToReach;
    // Reflect off walls
    const fieldH = CH;
    predictY = predictY % (fieldH * 2);
    if (predictY < 0) predictY += fieldH * 2;
    if (predictY > fieldH) predictY = fieldH * 2 - predictY;
    // Blend with actual ball Y based on difficulty
    predictY = predictY * aiReact + ballY * (1 - aiReact);
  }
  const aiTarget = predictY - PADDLE_H / 2;
  const aiDiff = aiTarget - aiY;
  aiY += Math.sign(aiDiff) * Math.min(Math.abs(aiDiff), aiSpeed);
  aiY = Math.max(0, Math.min(CH - PADDLE_H, aiY));

  // Ball movement
  ballX += ballVX;
  ballY += ballVY;

  // Top/bottom walls
  if (ballY - BALL_R <= 0) { ballY = BALL_R; ballVY = Math.abs(ballVY); playWallHit(); }
  if (ballY + BALL_R >= CH) { ballY = CH - BALL_R; ballVY = -Math.abs(ballVY); playWallHit(); }

  // Player paddle collision (left side, x ~= PADDLE_W + 10)
  const playerPaddleX = PADDLE_W + 10;
  if (ballVX < 0 &&
      ballX - BALL_R <= playerPaddleX + PADDLE_W &&
      ballX - BALL_R >= playerPaddleX - 5 &&
      ballY >= playerY - 4 && ballY <= playerY + PADDLE_H + 4) {
    ballX = playerPaddleX + PADDLE_W + BALL_R + 1;
    const hitPos = (ballY - playerY) / PADDLE_H - 0.5; // -0.5 to 0.5
    const speed = Math.min(Math.sqrt(ballVX * ballVX + ballVY * ballVY) * 1.07, 18);
    const angle = hitPos * 1.1;
    ballVX = speed * Math.cos(angle);
    ballVY = speed * Math.sin(angle);
    rallyCount++;
    playPaddleHit(speed);
    spawnPaddleSparks(playerPaddleX + PADDLE_W, ballY, '#06b6d4');
  }

  // AI paddle collision (right side)
  const aiPaddleX = CW - PADDLE_W - 10;
  if (ballVX > 0 &&
      ballX + BALL_R >= aiPaddleX &&
      ballX + BALL_R <= aiPaddleX + PADDLE_W + 5 &&
      ballY >= aiY - 4 && ballY <= aiY + PADDLE_H + 4) {
    ballX = aiPaddleX - BALL_R - 1;
    const hitPos = (ballY - aiY) / PADDLE_H - 0.5;
    const speed = Math.min(Math.sqrt(ballVX * ballVX + ballVY * ballVY) * 1.05, 18);
    const angle = Math.PI - hitPos * 1.0;
    ballVX = -speed * Math.cos(hitPos * 1.0);
    ballVY = speed * Math.sin(hitPos * 1.0);
    rallyCount++;
    playPaddleHit(speed);
    spawnPaddleSparks(aiPaddleX, ballY, '#f87171');
  }

  // Scoring
  if (ballX + BALL_R < 0) {
    // AI scores
    aiPoints++;
    playScore(false);
    scoreFlash = { active: true, color: '#f87171', life: 1 };
    updateUI();
    checkSet();
    gameState = 'scored';
    setTimeout(() => {
      if (gameState === 'scored') { launchBall(false); gameState = 'running'; }
    }, 1000);
  }
  if (ballX - BALL_R > CW) {
    // Player scores
    playerPoints++;
    playScore(true);
    scoreFlash = { active: true, color: '#4ade80', life: 1 };
    updateUI();
    checkSet();
    gameState = 'scored';
    setTimeout(() => {
      if (gameState === 'scored') { launchBall(true); gameState = 'running'; }
    }, 1000);
  }

  // Update sparks
  sparks = sparks.filter(s => s.life > 0);
  sparks.forEach(s => { s.x += s.vx; s.y += s.vy; s.vy += 0.1; s.life -= 0.07; });
  if (scoreFlash.active) { scoreFlash.life -= 0.04; if (scoreFlash.life <= 0) scoreFlash.active = false; }

  // Update particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; });
}

function checkSet() {
  const maxP = Math.max(playerPoints, aiPoints);
  const minP = Math.min(playerPoints, aiPoints);
  const playerWon = playerPoints > aiPoints && playerPoints >= POINTS_PER_SET && (playerPoints - aiPoints) >= 2;
  const aiWon     = aiPoints > playerPoints && aiPoints >= POINTS_PER_SET && (aiPoints - playerPoints) >= 2;
  // Simpler: first to 7
  if (playerPoints >= POINTS_PER_SET || aiPoints >= POINTS_PER_SET) {
    if (playerPoints > aiPoints) {
      playerSets++; endSet(true);
    } else {
      aiSets++; endSet(false);
    }
  }
}

function endSet(playerWon) {
  gameState = 'setOver';
  if (playerSets >= SETS_TO_WIN || aiSets >= SETS_TO_WIN) {
    setTimeout(() => endMatch(playerSets >= SETS_TO_WIN), 500);
  } else {
    currentSet++;
    playerPoints = 0; aiPoints = 0;
    updateUI();
    setTimeout(() => { launchBall(); gameState = 'running'; }, 1500);
  }
}

let matchResult = null;
function renderMatchResult() {
  if (matchResult === null) return;
  const playerWon = matchResult;
  const t = SillyI18n.t;
  document.getElementById('resultIcon').textContent    = playerWon ? '🏆' : '😓';
  document.getElementById('resultTitle').textContent   = playerWon ? t('youWinMatch') : t('cpuWins');
  document.getElementById('resultSubtitle').textContent = playerWon ? t('wonSub', playerSets, aiSets) : t('lostSub', aiSets, playerSets);
}

function endMatch(playerWon) {
  gameState = 'matchOver';
  if (playerWon) playWin(); else playLose();
  matchResult = playerWon;
  renderMatchResult();
  document.getElementById('resultOverlay').classList.add('active');
}

function spawnPaddleSparks(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const angle = (Math.random() - 0.5) * Math.PI;
    sparks.push({
      x, y,
      vx: (Math.random() * 3 + 1) * (x < CW / 2 ? 1 : -1),
      vy: Math.sin(angle) * (Math.random() * 3 + 1),
      color, life: 1
    });
  }
}

// ═══════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════
function draw() {
  // Background
  ctx.fillStyle = '#0a0a18';
  ctx.fillRect(0, 0, CW, CH);

  // Table surface
  const tableGrad = ctx.createLinearGradient(0, 0, CW, 0);
  tableGrad.addColorStop(0,   '#0c1a2e');
  tableGrad.addColorStop(0.5, '#0f2040');
  tableGrad.addColorStop(1,   '#0c1a2e');
  ctx.fillStyle = tableGrad;
  ctx.fillRect(0, 0, CW, CH);

  // Screen flash
  if (scoreFlash.active) {
    // Append two-digit hex alpha to the colour string
    ctx.fillStyle = scoreFlash.color + Math.round(scoreFlash.life * 40).toString(16).padStart(2, '0');
    ctx.fillRect(0, 0, CW, CH);
  }

  // Table border glow
  ctx.strokeStyle = 'rgba(6,182,212,0.25)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, CW - 2, CH - 2);

  // Centre line
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.setLineDash([12, 12]);
  ctx.beginPath(); ctx.moveTo(CW / 2, 0); ctx.lineTo(CW / 2, CH); ctx.stroke();
  ctx.setLineDash([]);

  // Centre circle
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(CW / 2, CH / 2, 40, 0, Math.PI * 2); ctx.stroke();

  // Net
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(CW / 2, 0); ctx.lineTo(CW / 2, CH); ctx.stroke();
  ctx.setLineDash([]);
  // Net post top
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(CW / 2 - 4, -4, 8, 12);
  ctx.fillRect(CW / 2 - 4, CH - 8, 8, 12);

  // Player paddle (left)
  const playerPaddleX = 10 + PADDLE_W;
  drawPaddle(playerPaddleX - PADDLE_W, playerY, '#06b6d4', '#0891b2');

  // AI paddle (right)
  const aiPaddleX = CW - PADDLE_W - 10;
  drawPaddle(aiPaddleX, aiY, '#f87171', '#dc2626');

  // Ball trail
  for (let i = 3; i > 0; i--) {
    ctx.globalAlpha = 0.15 * (4 - i) / 3;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ballX - ballVX * i * 0.7, ballY - ballVY * i * 0.7, BALL_R * (1 - i * 0.15), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Ball glow
  const ballGrad = ctx.createRadialGradient(ballX - 2, ballY - 2, 0, ballX, ballY, BALL_R * 2.5);
  ballGrad.addColorStop(0,   'rgba(255,255,200,0.25)');
  ballGrad.addColorStop(0.5, 'rgba(255,230,100,0.1)');
  ballGrad.addColorStop(1,   'rgba(255,200,0,0)');
  ctx.fillStyle = ballGrad;
  ctx.beginPath(); ctx.arc(ballX, ballY, BALL_R * 2.5, 0, Math.PI * 2); ctx.fill();

  // Ball
  const bGrad = ctx.createRadialGradient(ballX - 2, ballY - 2, 0, ballX, ballY, BALL_R);
  bGrad.addColorStop(0,   '#fffde7');
  bGrad.addColorStop(0.6, '#ffd54f');
  bGrad.addColorStop(1,   '#e65100');
  ctx.fillStyle = bGrad;
  ctx.beginPath(); ctx.arc(ballX, ballY, BALL_R, 0, Math.PI * 2); ctx.fill();

  // Sparks
  sparks.forEach(s => {
    ctx.globalAlpha = s.life;
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Score overlay (large temporary)
  if (scoreFlash.active && scoreFlash.life > 0.5) {
    ctx.globalAlpha = (scoreFlash.life - 0.5) * 2;
    ctx.font = 'bold 60px Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = scoreFlash.color;
    ctx.shadowColor = scoreFlash.color;
    ctx.shadowBlur = 20;
    ctx.fillText(`${playerPoints} – ${aiPoints}`, CW / 2, CH / 2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // Rally counter (top center)
  if (rallyCount >= 3) {
    ctx.font = 'bold 11px Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = rallyCount >= 8 ? '#fbbf24' : 'rgba(255,255,255,0.4)';
    ctx.fillText(SillyI18n.en('rallyX', rallyCount), CW / 2, 8);
  }

  // Sets display
  ctx.font = 'bold 12px Segoe UI, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = '#06b6d4';
  ctx.fillText('●'.repeat(playerSets) + '○'.repeat(SETS_TO_WIN - playerSets), 14, CH - 6);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f87171';
  ctx.fillText('●'.repeat(aiSets) + '○'.repeat(SETS_TO_WIN - aiSets), CW - 14, CH - 6);
}

function drawPaddle(x, y, colTop, colBot) {
  // Glow
  ctx.shadowColor = colTop;
  ctx.shadowBlur = 12;
  const g = ctx.createLinearGradient(x, y, x, y + PADDLE_H);
  g.addColorStop(0, colTop);
  g.addColorStop(1, colBot);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(x, y, PADDLE_W, PADDLE_H, PADDLE_W / 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Shine
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.roundRect(x + 2, y + 4, PADDLE_W - 4, PADDLE_H / 3, (PADDLE_W - 4) / 2);
  ctx.fill();
}

// ═══════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════
function loop() {
  if (gameState === 'running' || gameState === 'scored') {
    update();
    draw();
    requestAnimationFrame(loop);
  } else if (gameState === 'paused') {
    draw();
    // stopped — will be restarted on resume
  }
}

// ═══════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleY = CH / rect.height;
  const y = (e.clientY - rect.top) * scaleY;
  targetPlayerY = y - PADDLE_H / 2;
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleY = CH / rect.height;
  const y = (e.touches[0].clientY - rect.top) * scaleY;
  targetPlayerY = y - PADDLE_H / 2;
}, { passive: false });

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyP' || e.code === 'Space') { e.preventDefault(); togglePause(); }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ═══════════════════════════════════════════════
//  PAUSE
// ═══════════════════════════════════════════════
let pauseShown = false, startResumable = false;
function setPauseBtnText(p) {
  pauseShown = p;
  document.getElementById('pauseBtn').textContent = p ? SillyI18n.t('resume') : SillyI18n.t('pause');
  document.getElementById('pauseBadge').classList.toggle('visible', p);
}

function togglePause() {
  if (gameState === 'running' || gameState === 'scored') {
    savedGameState = gameState;
    gameState = 'paused';
    setPauseBtnText(true);
  } else if (gameState === 'paused') {
    gameState = savedGameState;
    savedGameState = null;
    setPauseBtnText(false);
    requestAnimationFrame(loop);
  }
}

// ═══════════════════════════════════════════════
//  UI
// ═══════════════════════════════════════════════
function updateUI() {
  document.getElementById('playerScore').textContent = playerPoints;
  document.getElementById('aiScore').textContent     = aiPoints;
  document.getElementById('setDisplay').textContent  = currentSet;
  document.getElementById('rallyDisplay').textContent = rallyCount;
}

function initGame(keepDiff = true) {
  playerPoints = 0; aiPoints = 0;
  playerSets = 0; aiSets = 0;
  currentSet = 1; rallyCount = 0; frame = 0;
  sparks = []; particles = [];
  playerY = CH / 2 - PADDLE_H / 2;
  aiY     = CH / 2 - PADDLE_H / 2;
  targetPlayerY = playerY;
  savedGameState = null;
  setPauseBtnText(false);
  launchBall();
  gameState = 'running';
  updateUI();
  requestAnimationFrame(loop);
}

// ── Difficulty pills
document.querySelectorAll('.diff-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.diff-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    aiDifficulty = pill.dataset.diff;
  });
});

// ── Buttons
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startOverlay').classList.remove('active');
  if (savedGameState !== null) {
    gameState = savedGameState;
    savedGameState = null;
    setPauseBtnText(false);
    requestAnimationFrame(loop);
  } else {
    initGame();
  }
});

document.getElementById('pauseBtn').addEventListener('click', togglePause);

document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('resultOverlay').classList.remove('active');
  initGame();
});

document.getElementById('howToPlayBtn').addEventListener('click', () => {
  const isActive = gameState === 'running' || gameState === 'scored';
  const isResumable = isActive || gameState === 'paused';
  if (isActive) {
    savedGameState = gameState;
    gameState = 'paused';
    setPauseBtnText(true);
  }
  startResumable = isResumable;
  document.getElementById('startBtn').textContent = isResumable ? SillyI18n.t('resumeGame') : SillyI18n.t('startGame');
  document.getElementById('startOverlay').classList.add('active');
});

document.getElementById('playAgainBtn').addEventListener('click', () => {
  document.getElementById('resultOverlay').classList.remove('active');
  initGame();
});

document.getElementById('exitBtn').addEventListener('click', () => window.location.href = '../../');
document.getElementById('resultExitBtn').addEventListener('click', () => window.location.href = '../../');

// ── Sound toggle
document.getElementById('soundBtn').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  btn.classList.toggle('muted', !soundEnabled);
});

// ═══════════════════════════════════════════════
//  BOOT — preview draw
// ═══════════════════════════════════════════════
(function previewDraw() {
  ballX = CW / 2; ballY = CH / 2;
  playerY = CH / 2 - PADDLE_H / 2;
  aiY     = CH / 2 - PADDLE_H / 2;
  draw();
})();
</script>

});
</script>
