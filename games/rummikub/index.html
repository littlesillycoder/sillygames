<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拉密 — GameZone</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d1a; --surface: #14142b; --card: #1c1c38; --border: #2a2a50;
      --accent: #7c3aed; --accent2: #06b6d4; --text: #eef2f7; --muted: #aab4c5; --soft: #d3dae6;
      --gold: #f5c518;
      --tw: 46px; --th: 64px; --tf: 1.75rem;
      --c0: #e0262e; --c1: #1f5bd8; --c2: #f08a00; --c3: #161616;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; user-select: none;
      overflow-x: hidden;
    }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 1.5rem; height: 54px; display: flex; align-items: center; gap: 1rem; flex-shrink: 0;
    }
    .topbar .brand { font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
    .topbar .brand a { color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
    .topbar .sep { color: var(--muted); }
    .topbar-actions { margin-left: auto; display: flex; gap: 0.6rem; align-items: center; }
    .btn {
      padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s; color: var(--text);
      font-family: inherit; white-space: nowrap;
    }
    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #5b21b6); color: #fff; }
    .btn-green { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; }
    .btn-danger { background: linear-gradient(135deg, #dc2626, #991b1b); color: #fff; }
    .sound-toggle { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.7rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .sound-toggle.muted { opacity: 0.4; }
    #game-avatar { display: flex; align-items: center; margin-left: 0.5rem; }

    /* ── LAYOUT: players | table + rack | status ── */
    .game-wrapper {
      flex: 1; display: flex; justify-content: center; align-items: stretch;
      padding: 0.9rem 1rem; gap: 1rem; min-height: 0;
    }
    .rules-mini > div + div { margin-top: 0.45rem; }
    .rules-mini, .modal p, .modal li, .status-text { text-wrap: pretty; }
    .side { width: 230px; flex-shrink: 0; display: flex; flex-direction: column; gap: 0.75rem; }
    .main { flex: 1; max-width: 900px; min-width: 0; display: flex; flex-direction: column; gap: 0.7rem; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.8rem 0.95rem;
    }
    .card-label { font-size: 0.95rem; font-weight: 700; color: var(--muted); margin-bottom: 0.4rem; }
    .player-row {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.65rem 0.85rem; display: flex; align-items: center; gap: 0.6rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .player-row.active { border-color: var(--accent2); box-shadow: 0 0 16px rgba(6,182,212,0.3); }
    .player-row .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    .player-row .info { flex: 1; min-width: 0; }
    .player-row .name { font-weight: 700; font-size: 1.02rem; display: flex; align-items: center; gap: 0.35rem; }
    .player-row .sub { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .player-row .sub .ok { color: #4ade80; }
    .player-row .count { font-size: 1.35rem; font-weight: 800; color: var(--accent2); font-variant-numeric: tabular-nums; text-align: right; }
    .player-row .count small { display: block; font-size: 0.7rem; color: var(--muted); font-weight: 600; }
    .thinking { display: none; gap: 3px; }
    .player-row.thinking-on .thinking { display: inline-flex; }
    .thinking i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent2); animation: blink 1s infinite; }
    .thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    .pool-num { font-size: 1.85rem; font-weight: 800; color: var(--gold); }
    .status-text { font-size: 1rem; line-height: 1.55; }
    .status-meta { color: var(--muted); font-size: 0.88rem; margin-top: 0.35rem; }
    .open-meter { margin-top: 0.5rem; font-size: 0.9rem; color: var(--soft); }
    .open-meter .bar { height: 7px; background: var(--bg); border-radius: 4px; margin-top: 4px; overflow: hidden; }
    .open-meter .bar i { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #4ade80); width: 0; transition: width .2s; }
    .side .btn { width: 100%; }
    .record { font-size: 0.88rem; color: var(--muted); text-align: center; }
    .rules-mini { font-size: 0.9rem; color: var(--soft); line-height: 1.6; }
    .rules-mini b { color: #fff; }

    /* ── TABLE ── */
    #table {
      flex: 1; min-height: 280px; overflow-y: auto; border-radius: 14px; padding: 12px;
      background: radial-gradient(ellipse at 50% 35%, #1b6b5c, #0f4038 75%);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.45), 0 6px 20px rgba(0,0,0,0.4);
      display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px;
      border: 2px solid #0b2f2a;
    }
    .meld {
      display: inline-flex; gap: 3px; padding: 6px; border-radius: 10px;
      background: rgba(0,0,0,0.18); border: 2px solid transparent; cursor: pointer;
      min-height: calc(var(--th) + 16px);
    }
    .meld.invalid { border-color: #f87171; background: rgba(248,113,113,0.15); }
    .meld.drop-hover, #newMeld.drop-hover { border-color: #fde047; background: rgba(253,224,71,0.15); }
    #newMeld {
      min-width: calc(var(--tw) * 3); min-height: calc(var(--th) + 16px); border-radius: 10px;
      border: 2px dashed rgba(255,255,255,0.35); color: rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: 0.9rem; font-weight: 600; padding: 6px 12px; cursor: pointer;
    }
    .table-empty-hint { color: rgba(255,255,255,0.55); font-size: 1rem; align-self: center; margin: auto; }

    /* ── RACK ── */
    .rack-wrap {
      background: linear-gradient(180deg, #8a5d36, #5c3b1e); border-radius: 14px; padding: 10px 12px 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.15);
    }
    #rack {
      display: flex; flex-wrap: wrap; gap: 4px; min-height: calc(var(--th) * 2 + 12px); align-content: flex-start;
      padding: 4px; border-radius: 8px; background: rgba(0,0,0,0.15);
    }
    #rack.drop-hover { background: rgba(253,224,71,0.15); }
    .rack-hidden { color: rgba(255,255,255,0.8); font-size: 1rem; margin: auto; }
    .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; }
    .actions .btn { padding: 0.6rem 0.75rem; font-size: 0.95rem; white-space: nowrap; }

    /* ── TILE ── */
    .tile {
      width: var(--tw); height: var(--th); border-radius: 6px; flex-shrink: 0; position: relative;
      background: linear-gradient(180deg, #fffef9 0%, #f6f1e3 70%, #e9e1cc 100%);
      box-shadow: inset 0 -3px 0 #d8ccb0, inset 0 1px 0 #fff, 0 1px 0 #a99a78, 0 3px 6px rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center; padding-bottom: calc(var(--th) * 0.16);
      font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      font-weight: 900; font-size: var(--tf); line-height: 1; letter-spacing: -0.04em;
      cursor: grab; touch-action: none; transition: transform 0.12s, box-shadow 0.12s;
    }
    /* the round dimple moulded into a real tile */
    .tile::before {
      content: ''; position: absolute; left: 50%; top: 42%; width: 78%; aspect-ratio: 1; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 50% 30%, #f1ebdb, #fbf8ef 75%);
      box-shadow: inset 0 1px 1.5px rgba(120,100,60,0.18), 0 1px 0 rgba(255,255,255,0.8);
    }
    .tile > * , .tile .num { position: relative; }
    .tile .num { display: block; }
    .tile.c0 { color: var(--c0); } .tile.c1 { color: var(--c1); } .tile.c2 { color: var(--c2); } .tile.c3 { color: var(--c3); }
    .tile.joker { color: #1a1a1a; }
    .tile.joker svg { width: 80%; height: auto; display: block; }
    .tile.selected { transform: translateY(-7px); box-shadow: 0 0 0 3px #22d3ee, 0 8px 14px rgba(0,0,0,0.4); }
    .tile.fresh { box-shadow: 0 0 0 3px #4ade80, 0 3px 6px rgba(0,0,0,0.35); }
    .tile.last { box-shadow: 0 0 0 3px #facc15, 0 3px 6px rgba(0,0,0,0.35); }
    .tile.locked { cursor: not-allowed; }
    .tile.hint { animation: hintPulse 1s ease-in-out infinite; }
    .meld.hint-meld { border-color: #facc15; background: rgba(250,204,21,0.14); }
    @keyframes hintPulse { 0%,100% { box-shadow: 0 0 0 3px #facc15, 0 3px 6px rgba(0,0,0,0.35); transform: translateY(0); }
      50% { box-shadow: 0 0 0 4px #fde047, 0 0 16px 4px rgba(250,204,21,0.7); transform: translateY(-4px); } }
    .rack-row { display: flex; gap: 10px; align-items: stretch; }
    .rack-row .rack-wrap { flex: 1; min-width: 0; }
    .hint-box { flex: none; padding: 0.6rem 0.75rem; border-radius: 14px; background: var(--card);
      border: 2px solid rgba(250,204,21,0.7); box-shadow: 0 6px 18px rgba(0,0,0,0.4); color: #fde68a; font-size: 0.9rem; line-height: 1.5; text-wrap: pretty; }
    .hint-box b { color: #fff; } .hint-box .hint-title { font-weight: 800; color: #facc15; margin-bottom: 0.2rem; }
    .hint-box .hint-note { color: #aab4c5; font-size: 0.85rem; margin-top: 0.25rem; }
    .btn-play { background: linear-gradient(135deg, #0ea5e9, #06b6d4); color: #04222b; border: none; font-weight: 800; }
    .btn-play:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-hint { background: linear-gradient(135deg, #f59e0b, #eab308); color: #2a1a00; border: none; font-weight: 800; }
    .btn-hint:disabled { opacity: 0.4; cursor: not-allowed; }
    .tile.ghost { position: fixed; z-index: 1000; pointer-events: none; transform: rotate(-4deg) scale(1.08); opacity: 0.95; }
    .tile.dragging-src { opacity: 0.3; }

    .toast {
      position: fixed; left: 50%; top: 70px; transform: translate(-50%, -10px);
      background: rgba(10,10,25,0.95); border: 1px solid var(--border); color: #fff;
      padding: 0.6rem 1.2rem; border-radius: 16px; font-size: 1rem; line-height: 1.5; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: 92vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ── OVERLAYS ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.25s; padding: 1rem;
    }
    .overlay.active { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 1.8rem 2rem; max-width: 560px; width: 100%;
      text-align: center; max-height: 92vh; overflow-y: auto; position: relative;
    }
    .modal .lang-switch { position: absolute; top: 1rem; right: 1rem; }
    .modal-icon { font-size: 2.4rem; margin-bottom: 0.4rem; display: flex; justify-content: center; gap: 4px; }
    .modal-icon .tile { cursor: default; }
    .modal h2 { font-size: 1.7rem; font-weight: 800; margin-bottom: 0.5rem; }
    .modal p { color: var(--soft); font-size: 1.05rem; line-height: 1.7; margin-bottom: 1.1rem; }
    html[lang="en"] .modal p { text-align: left; }
    .opt-label { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0.3rem 0 0.5rem; }
    .pills { display: flex; gap: 0.45rem; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .pill {
      padding: 0.45rem 1rem; border-radius: 999px; border: 1px solid var(--border);
      background: var(--bg); color: var(--soft); font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .pill:hover { border-color: var(--accent); color: var(--text); }
    .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .seats { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 1rem; }
    .seat-row { display: flex; align-items: center; gap: 0.7rem; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 0.45rem 0.7rem; }
    .seat-row .dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
    .seat-row .seat-name { font-weight: 700; font-size: 1rem; flex: 1; text-align: left; }
    .seat-row .pills { margin: 0; flex-wrap: nowrap; }
    .seat-row .pill { padding: 0.3rem 0.8rem; font-size: 0.9rem; }
    .modal-btns { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: nowrap; margin-top: 0.4rem; }
    .modal-btns .btn { font-size: 1.05rem; padding: 0.7rem 1.2rem; }
    .rules { text-align: left; color: var(--soft); font-size: 1.03rem; line-height: 1.7; margin: 0 0 1.2rem 1.2rem; }
    .rules li { margin-bottom: 0.6rem; padding-left: 0.2rem; }
    .rules li::marker { color: var(--accent2); }
    .rules b { color: #fff; }
    .result-table { width: 100%; border-collapse: collapse; margin: 0.4rem 0 1.2rem; font-size: 1rem; }
    .result-table th { color: var(--muted); font-weight: 700; font-size: 0.85rem; padding: 0.4rem; text-align: left; }
    .result-table td { padding: 0.5rem 0.4rem; border-top: 1px solid var(--border); text-align: left; }
    .result-table td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
    .result-table th.num { text-align: right; }
    .result-table .win td { color: #fde047; }

    @media (max-width: 1100px) {
      .game-wrapper { flex-wrap: wrap; }
      .main { order: -1; flex-basis: 100%; max-width: none; }
      .side { width: calc(50% - 0.5rem); }
    }
    @media (max-width: 640px) {
      :root { --tw: 32px; --th: 46px; --tf: 1.2rem; }
      .game-wrapper { padding: 0.5rem; gap: 0.5rem; }
      .side { width: 100%; }
      .side-right { order: -1; }
      .side-right .hint-box { order: -1; }
      .main { order: -2; }
      .topbar { padding: 0 0.6rem; gap: 0.4rem; }
      .topbar .btn { padding: 0.4rem 0.55rem; }
      .topbar .sep { display: none; }
      .topbar-actions { gap: 0.35rem; }
      .hide-sm { display: none; }
      .modal { padding: 3.2rem 1rem 1.4rem; }
      .modal .lang-switch { top: 0.7rem; right: 0.7rem; }
      .actions .btn { padding: 0.5rem 0.6rem; font-size: 0.88rem; }
      .modal-btns { flex-wrap: wrap; }
      #table { min-height: 220px; padding: 8px; gap: 8px; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <a href="../../">🏠</a>
    <span class="sep">/</span>
    <span data-i18n="brand"></span>
  </div>
  <div class="topbar-actions">
    <div data-lang-switch></div>
    <button class="sound-toggle" id="soundBtn" data-i18n-title="sound">🔊</button>
    <button class="btn btn-ghost" id="howToPlayBtn">❓<span class="hide-sm" data-i18n="rulesBtn"></span></button>
    <button class="btn btn-ghost" id="newGameBtn">↺<span class="hide-sm" data-i18n="newGame"></span></button>
    <button class="btn btn-danger" id="exitBtn">✕<span class="hide-sm" data-i18n="exit"></span></button>
  </div>
  <div id="game-avatar"></div>
</div>

<div class="game-wrapper">
  <!-- left: players -->
  <div class="side">
    <div id="players" style="display:flex;flex-direction:column;gap:0.6rem"></div>
    <div class="card">
      <div class="card-label" data-i18n="pool"></div>
      <div class="pool-num" id="poolNum">0</div>
    </div>
    <div class="card rules-mini" data-i18n-html="miniRules"></div>
  </div>

  <!-- centre: table + rack -->
  <div class="main">
    <div id="table"></div>
    <div class="rack-row">
      <div class="rack-wrap">
        <div id="rack"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="sortNumBtn" data-i18n="sortNum"></button>
      <button class="btn btn-ghost" id="sortColBtn" data-i18n="sortCol"></button>
      <button class="btn btn-ghost" id="resetBtn" data-i18n="reset"></button>
      <button class="btn btn-hint" id="hintBtn" data-i18n="hint"></button>
      <button class="btn btn-play" id="playBtn"></button>
      <button class="btn btn-primary" id="drawBtn"></button>
      <button class="btn btn-green" id="doneBtn" data-i18n="done"></button>
    </div>
  </div>

  <!-- right: status -->
  <div class="side side-right">
    <div class="card">
      <div class="status-text" id="statusText"></div>
      <div class="status-meta" id="statusMeta"></div>
      <div class="open-meter" id="openMeter" style="display:none">
        <span id="openText"></span>
        <div class="bar"><i id="openBar"></i></div>
      </div>
    </div>
    <div class="card">
      <div class="card-label" data-i18n="howToMove"></div>
      <div class="rules-mini" data-i18n-html="moveHelp"></div>
    </div>
    <div class="record" id="recordText"></div>
    <div class="hint-box" id="hintBox" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Setup -->
<div class="overlay active" id="setupOverlay">
  <div class="modal">
    <div data-lang-switch="full"></div>
    <div class="modal-icon" id="setupTiles"></div>
    <h2 data-i18n="title"></h2>
    <p data-i18n-html="intro"></p>
    <div class="opt-label" data-i18n="numPlayers"></div>
    <div class="pills" data-group="n">
      <div class="pill active" data-val="2">2</div>
      <div class="pill" data-val="3">3</div>
      <div class="pill" data-val="4">4</div>
    </div>
    <div class="opt-label" data-i18n="seatsLabel"></div>
    <div class="seats" id="seats"></div>
    <div id="levelOpt">
      <div class="opt-label" data-i18n="cpuLevel"></div>
      <div class="pills" data-group="level">
        <div class="pill" data-val="easy" data-i18n="easy"></div>
        <div class="pill active" data-val="medium" data-i18n="medium"></div>
        <div class="pill" data-val="hard" data-i18n="hard"></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" id="startBtn" data-i18n="start"></button>
      <button class="btn btn-ghost" id="continueBtn" style="display:none" data-i18n="continue"></button>
      <button class="btn btn-ghost" id="cancelSetupBtn" style="display:none" data-i18n="cancel"></button>
      <button class="btn btn-danger" onclick="window.location.href='../../'" data-i18n="exitBtn"></button>
    </div>
  </div>
</div>

<!-- Rules -->
<div class="overlay" id="helpOverlay">
  <div class="modal">
    <div data-lang-switch="full"></div>
    <div class="modal-icon">📖</div>
    <h2 data-i18n="helpTitle"></h2>
    <ul class="rules" data-i18n-html="rulesList"></ul>
    <div class="modal-btns"><button class="btn btn-primary" id="helpCloseBtn" data-i18n="gotIt"></button></div>
  </div>
</div>

<!-- Pass-the-device cover for several human players -->
<div class="overlay" id="coverOverlay">
  <div class="modal" style="max-width:420px">
    <div class="modal-icon">🙈</div>
    <h2 id="coverTitle"></h2>
    <p data-i18n="coverText" style="text-align:center"></p>
    <div class="modal-btns"><button class="btn btn-primary" id="coverBtn" data-i18n="ready"></button></div>
  </div>
</div>

<!-- Result -->
<div class="overlay" id="resultOverlay">
  <div class="modal">
    <div class="modal-icon" id="resultIcon">🏆</div>
    <h2 id="resultTitle"></h2>
    <p id="resultSub"></p>
    <table class="result-table" id="resultTable"></table>
    <div class="modal-btns">
      <button class="btn btn-primary" id="playAgainBtn" data-i18n="playAgain"></button>
      <button class="btn btn-ghost" id="reviewBtn" data-i18n="viewBoard"></button>
      <button class="btn btn-danger" id="resultExitBtn" data-i18n="exitBtn"></button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="../shared/i18n.js"></script>
<script>

const t = SillyI18n.t;

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
const R = Rummikub;
const SEAT_COLORS = ['#ef4444', '#3b82f6', '#f59e0b', '#a855f7'];
const GAME_KEY = 'rk_game', STATS_KEY = 'rk_save';

let settings = { n: 2, level: 'medium', seats: ['human', 'cpu', 'cpu', 'cpu'] };
let S = null;              // { n, seats, level, racks, pool, table, opened, turn, round, passes, over, winner, lastPlayed }
let turnStart = null;      // { table, rack } at the start of the current human turn
let selected = new Set();
let hintIds = new Set(), hintMelds = [], hintLines = null, hintStale = false;   // tiles / table sets highlighted by the hint
let phase = 'setup';       // setup | play | over
let busy = false, cpuTimer = null, token = 0;
let lastMsg = null;        // { key, args } for the status line

const isHuman = p => S.seats[p] === 'human';
const humans = () => S ? [...Array(S.n).keys()].filter(isHuman) : [];
const curRack = () => S.racks[S.turn];
function playerName(p) {
  if (isHuman(p)) return humans().length === 1 ? t('you') : t('player', humans().indexOf(p) + 1);
  const cpus = [...Array(S.n).keys()].filter(q => !isHuman(q));
  return t('cpuName', cpus.indexOf(p) + 1, t(S.level));
}
// rack shown on screen: the current human's, or (single human) always that human's
function viewer() {
  const hs = humans();
  if (isHuman(S.turn)) return S.turn;
  return hs.length === 1 ? hs[0] : -1;
}

// ═══════════════════════════════════════════════
//  SOUND
// ═══════════════════════════════════════════════
let soundOn = true;
const Sound = (() => {
  let ac = null;
  const ctx = () => { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; };
  function tone(f, type, when, dur, vol = 0.12) {
    if (!soundOn) return;
    const c = ctx(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.type = type; o.frequency.setValueAtTime(f, when);
    g.gain.setValueAtTime(0.001, when); g.gain.linearRampToValueAtTime(vol, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur); o.start(when); o.stop(when + dur + 0.02);
  }
  return {
    tap()  { if (soundOn) tone(1200, 'triangle', ctx().currentTime, 0.05, 0.08); },
    place(){ if (soundOn) { const t0 = ctx().currentTime; tone(520, 'square', t0, 0.04, 0.05); tone(260, 'triangle', t0, 0.08, 0.1); } },
    draw() { if (soundOn) { const t0 = ctx().currentTime; tone(700, 'sine', t0, 0.08); tone(500, 'sine', t0 + 0.07, 0.1); } },
    bad()  { if (soundOn) tone(160, 'square', ctx().currentTime, 0.14, 0.07); },
    win()  { if (soundOn) { const t0 = ctx().currentTime; [523, 659, 784, 1047].forEach((f, i) => tone(f, 'triangle', t0 + i * 0.12, 0.3)); } },
    lose() { if (soundOn) { const t0 = ctx().currentTime; [392, 330, 262].forEach((f, i) => tone(f, 'triangle', t0 + i * 0.16, 0.35)); } },
  };
})();

// ═══════════════════════════════════════════════
//  GAME FLOW
// ═══════════════════════════════════════════════
function cancelCpu() { token++; if (cpuTimer) { clearTimeout(cpuTimer); cpuTimer = null; } busy = false; }

function newGame() {
  cancelCpu();
  const { pool, racks } = R.deal(settings.n);
  S = {
    n: settings.n, seats: settings.seats.slice(0, settings.n), level: settings.level,
    racks, pool, table: [], opened: Array(settings.n).fill(false),
    turn: 0, round: 1, passes: 0, over: false, winner: -1, lastPlayed: [],
  };
  racks.forEach(r => sortRack(r, 'num'));
  phase = 'play';
  closeOverlays();
  beginTurn();
}

function beginTurn() {
  selected.clear(); clearHint();
  turnStart = { table: S.table.map(m => m.slice()), rack: S.racks[S.turn].slice() };
  save();
  if (isHuman(S.turn)) {
    lastMsg = lastMsg && lastMsg.keep ? lastMsg : null;
    if (humans().length > 1) showCover(); else render();
  } else {
    busy = true;
    render();
    const my = ++token;
    cpuTimer = setTimeout(() => { cpuTimer = null; if (my === token) cpuTurn(); }, 750);
  }
}

function endTurn() {
  if (!S.racks[S.turn].length) { finish(S.turn, 'out'); return; }
  if (S.pool.length === 0 && S.passes >= S.n) {
    let best = 0;
    for (let p = 1; p < S.n; p++) if (R.handValue(S.racks[p]) < R.handValue(S.racks[best])) best = p;
    finish(best, 'low'); return;
  }
  S.turn = (S.turn + 1) % S.n;
  if (S.turn === 0) S.round++;
  beginTurn();
}

function cpuTurn() {
  const p = S.turn;
  const mv = R.cpuMove(S.table, S.racks[p], S.opened[p], S.level);
  if (mv) {
    const playedSet = new Set(mv.played);
    S.table = mv.table;
    S.racks[p] = S.racks[p].filter(id => !playedSet.has(id));
    S.opened[p] = true;
    S.passes = 0;
    S.lastPlayed = mv.played.slice();
    lastMsg = { key: 'cpuPlayed', args: [p, mv.played.length], keep: true };
    Sound.place();
  } else if (S.pool.length) {
    S.racks[p].push(S.pool.pop());
    S.passes = 0;
    S.lastPlayed = [];
    lastMsg = { key: 'cpuDrew', args: [p], keep: true };
    Sound.draw();
  } else {
    S.passes++;
    S.lastPlayed = [];
    lastMsg = { key: 'cpuPassed', args: [p], keep: true };
  }
  busy = false;
  render();
  const my = ++token;
  cpuTimer = setTimeout(() => { cpuTimer = null; if (my === token) endTurn(); }, 650);
}

// ── human actions ──
function humanDraw() {
  if (busy || phase !== 'play' || !isHuman(S.turn)) return;
  resetTurn(true);
  if (S.pool.length) { S.racks[S.turn].push(S.pool.pop()); S.passes = 0; lastMsg = { key: 'youDrew', args: [], keep: true }; Sound.draw(); }
  else { S.passes++; lastMsg = null; }
  S.lastPlayed = [];
  sortRack(S.racks[S.turn], rackSort);
  render();
  endTurn();
}

function humanDone() {
  if (busy || phase !== 'play' || !isHuman(S.turn)) return;
  const p = S.turn;
  const chk = R.checkTurn(turnStart.table, S.table, turnStart.rack, S.racks[p], S.opened[p]);
  if (!chk.ok) {
    Sound.bad();
    const msg = { invalid: t('errInvalid'), under30: t('errUnder30', chk.value || 0), notOpenedTouch: t('errNotOpened'),
                  noTiles: t('errNoTiles'), tookFromTable: t('errTookFromTable') }[chk.reason];
    toast(msg);
    render();
    return;
  }
  S.opened[p] = true;
  S.passes = 0;
  S.lastPlayed = chk.played;
  lastMsg = null;
  Sound.place();
  S.table = S.table.map(m => R.meldInfo(m).order);
  endTurn();
}

function resetTurn(silent) {
  if (!turnStart || phase !== 'play') return;
  S.table = turnStart.table.map(m => m.slice());
  S.racks[S.turn] = turnStart.rack.slice();
  selected.clear(); clearHint();
  if (!silent) { Sound.tap(); render(); }
}

function finish(winner, how) {
  cancelCpu();
  S.over = true; S.winner = winner; S.how = how;
  phase = 'over';
  clearSave();
  const hs = humans();
  if (hs.length === 1) { const won = winner === hs[0]; recordResult(won); won ? Sound.win() : Sound.lose(); }
  else Sound.win();
  render();
  renderResult();
  setTimeout(() => document.getElementById('resultOverlay').classList.add('active'), 500);
}

function renderResult() {
  if (!S || !S.over) return;
  const w = S.winner, hs = humans();
  const left = S.racks.map(r => R.handValue(r));
  const scores = left.map((v, p) => p === w ? left.reduce((a, b, q) => a + (q === w ? 0 : b), 0) : -v);
  let title, icon;
  if (hs.length === 1) { title = w === hs[0] ? t('youWin') : t('youLose'); icon = w === hs[0] ? '🏆' : '😵'; }
  else { title = t('wins', playerName(w)); icon = '🏆'; }
  document.getElementById('resultIcon').textContent = icon;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = S.how === 'out' ? t('winOut', playerName(w)) : t('winLow', playerName(w));
  document.getElementById('resultTable').innerHTML =
    `<tr><th>${t('colPlayer')}</th><th class="num">${t('colLeft')}</th><th class="num">${t('colScore')}</th></tr>` +
    [...Array(S.n).keys()].map(p => `<tr class="${p === w ? 'win' : ''}"><td><span style="color:${SEAT_COLORS[p]}">●</span> ${playerName(p)}</td>` +
      `<td class="num">${left[p]}</td><td class="num">${scores[p] > 0 ? '+' : ''}${scores[p]}</td></tr>`).join('');
}

// ── moving tiles ──
function locate(id) {
  const r = S.racks[S.turn].indexOf(id);
  if (r >= 0) return { where: 'rack' };
  for (let i = 0; i < S.table.length; i++) if (S.table[i].includes(id)) return { where: 'table', meld: i };
  return null;
}
const playedThisTurn = id => turnStart && turnStart.rack.includes(id);
function canMove(id) {
  const loc = locate(id);
  if (!loc) return false;
  if (loc.where === 'rack') return true;
  return S.opened[S.turn] || playedThisTurn(id);
}

// target: { meld: i } | { newMeld: true } | { rack: true }
function moveTiles(ids, target) {
  if (busy || phase !== 'play' || !isHuman(S.turn)) return;
  ids = ids.filter(id => locate(id));
  if (!ids.length) return;
  for (const id of ids) {
    if (!canMove(id)) { Sound.bad(); toast(t('errLocked')); return; }
    if (target.rack && locate(id).where === 'table' && !playedThisTurn(id)) { Sound.bad(); toast(t('errBackToRack')); return; }
  }
  const targetMeld = target.meld !== undefined ? S.table[target.meld] : null;
  // remove from current places
  for (const id of ids) {
    const loc = locate(id);
    if (loc.where === 'rack') S.racks[S.turn].splice(S.racks[S.turn].indexOf(id), 1);
    else S.table[loc.meld].splice(S.table[loc.meld].indexOf(id), 1);
  }
  if (target.rack) S.racks[S.turn].push(...ids);
  else if (targetMeld) targetMeld.push(...ids);
  else S.table.push(ids.slice());
  // tidy: drop empty sets, show valid sets in order
  S.table = S.table.filter(m => m.length).map(m => { const info = R.meldInfo(m); return info.ok ? info.order : m; });
  selected.clear();
  ids.forEach(id => hintIds.delete(id));
  Sound.place();
  render();
}

// ── hint: the hard CPU's move from the start of this turn ──
let hintMove = null, hintUnder = null;
function clearHint() { hintIds = new Set(); hintMelds = []; hintLines = null; hintMove = null; hintUnder = null; }
function tileName(id) {
  if (R.isJ(id)) return t('hintJoker');
  const T = R.TILES[id];
  return t('colors')[T.c] + (SillyI18n.lang === 'en' ? ' ' : '') + T.n;
}
function showHint() {
  if (busy || phase !== 'play' || !isHuman(S.turn)) return;
  const p = S.turn;
  const mv = R.cpuMove(turnStart.table, turnStart.rack, S.opened[p], 'hard');
  Sound.tap();
  if (!mv || !mv.played.length) {
    clearHint(); hintLines = [];
    // not opened yet: show the sets they *can* make, and why it is not enough
    if (!S.opened[p]) {
      const best = R.bestMeldSet(turnStart.rack, { nodeLimit: 20000 });
      if (best && best.melds.length) { hintUnder = { melds: best.melds, value: best.value }; hintIds = new Set(best.melds.flat().filter(id => S.racks[p].includes(id))); }
    }
    render(); return;
  }
  const played = new Set(mv.played);
  const lines = [];
  const sameSet = (a, b) => a.length === b.length && a.every(id => b.includes(id));
  for (const m of mv.table) {
    const mine = m.filter(id => played.has(id));
    if (!mine.length) continue;
    const base = m.filter(id => !played.has(id));
    lines.push({ tiles: mine, kind: !base.length ? 'hintNew' : turnStart.table.some(o => sameSet(o, base)) ? 'hintAdd' : 'hintRe' });
  }
  // highlight: tiles still in the rack, and the current table sets that the hint adds to
  hintIds = new Set(mv.played.filter(id => S.racks[p].includes(id)));
  hintMelds = turnStart.table.filter(m => mv.table.some(n => n.some(id => played.has(id)) && m.some(id => n.includes(id)))).map(m => m.slice());
  hintLines = lines;
  hintMove = mv;
  hintStale = S.racks[p].length !== turnStart.rack.length || JSON.stringify(S.table) !== JSON.stringify(turnStart.table);
  render();
}
document.getElementById('hintBtn').addEventListener('click', showHint);

// 出牌: selected tiles → a new set; nothing selected but a hint showing → lay the hint out
function playButton() {
  if (busy || phase !== 'play' || !isHuman(S.turn)) return;
  const p = S.turn;
  if (selected.size) {
    const sel = [...selected];
    moveTiles(sel, { newMeld: true });
    return;
  }
  if (hintMove) {
    const played = new Set(hintMove.played);
    S.table = hintMove.table.map(m => m.slice());
    S.racks[p] = turnStart.rack.filter(id => !played.has(id));
    sortRack(S.racks[p], rackSort);
    hintIds = new Set(); hintStale = false;
    Sound.place();
    render();
  }
}
document.getElementById('playBtn').addEventListener('click', playButton);

let rackSort = 'num';
function sortRack(rack, mode) {
  const T = R.TILES;
  rack.sort((a, b) => {
    if (R.isJ(a) || R.isJ(b)) return R.isJ(a) - R.isJ(b);
    return mode === 'num' ? (T[a].n - T[b].n) || (T[a].c - T[b].c) : (T[a].c - T[b].c) || (T[a].n - T[b].n);
  });
}

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
const JOKER_SVG = '<svg viewBox="0 0 40 40" aria-label="joker"><circle cx="20" cy="20" r="17" fill="none" stroke="#1a1a1a" stroke-width="2.4"/>' +
  '<path d="M11.5 15.5q2.5-3 5 0M23.5 15.5q2.5-3 5 0" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>' +
  '<circle cx="14" cy="17" r="1.6" fill="#1a1a1a"/><circle cx="26" cy="17" r="1.6" fill="#1a1a1a"/>' +
  '<path d="M18.6 19.5q1.4 3 2.8 0" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>' +
  '<path d="M11 24q9 9 18 0" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round"/>' + '</svg>';
function tileHTML(id, extra) {
  const T = R.TILES[id];
  const cls = ['tile', R.isJ(id) ? 'joker' : 'c' + T.c];
  if (extra) cls.push(extra);
  return `<div class="${cls.join(' ')}" data-id="${id}">${R.isJ(id) ? JOKER_SVG : `<span class="num">${T.n}</span>`}</div>`;
}

function render() {
  if (!S) return renderSetupPreview();
  const myTurn = phase === 'play' && isHuman(S.turn) && !busy;
  const lastSet = new Set(S.lastPlayed || []);
  // players
  document.getElementById('players').innerHTML = [...Array(S.n).keys()].map(p => `
    <div class="player-row ${phase === 'play' && p === S.turn ? 'active' : ''} ${phase === 'play' && p === S.turn && busy ? 'thinking-on' : ''}">
      <div class="dot" style="background:${SEAT_COLORS[p]}"></div>
      <div class="info">
        <div class="name">${playerName(p)}<span class="thinking"><i></i><i></i><i></i></span></div>
        <div class="sub">${S.opened[p] ? `<span class="ok">${t('opened')}</span>` : t('notOpened')}</div>
      </div>
      <div class="count">${S.racks[p].length}<small>${t('tiles')}</small></div>
    </div>`).join('');
  document.getElementById('poolNum').textContent = S.pool.length;

  // table
  const tb = document.getElementById('table');
  const playedSet = new Set(turnStart ? S.racks[S.turn] && turnStart.rack.filter(id => !S.racks[S.turn].includes(id)) : []);
  let html = S.table.map((m, i) => {
    const ok = R.meldInfo(m).ok;
    return `<div class="meld ${ok ? '' : 'invalid'} ${myTurn && hintLines && hintMelds.some(h => m.some(id => h.includes(id))) ? 'hint-meld' : ''}" data-meld="${i}">` + m.map(id => {
      const locked = myTurn && !S.opened[S.turn] && !playedThisTurn(id);
      const extra = myTurn && playedSet.has(id) ? 'fresh' : lastSet.has(id) ? 'last' : '';
      return tileHTML(id, [extra, locked ? 'locked' : '', selected.has(id) ? 'selected' : ''].filter(Boolean).join(' '));
    }).join('') + '</div>';
  }).join('');
  if (myTurn) html += `<div id="newMeld">${t('newMeld')}</div>`;
  else if (!S.table.length) html += `<div class="table-empty-hint">${t('tableEmpty')}</div>`;
  tb.innerHTML = html;

  // rack
  const v = viewer();
  const rk = document.getElementById('rack');
  if (v < 0) rk.innerHTML = `<div class="rack-hidden">${t('thinking', playerName(S.turn))}</div>`;
  else rk.innerHTML = S.racks[v].map(id => tileHTML(id, selected.has(id) ? 'selected' : hintIds.has(id) ? 'hint' : '')).join('');

  // status
  let text;
  if (phase === 'over') text = t('wins', playerName(S.winner));
  else if (busy) text = t('thinking', playerName(S.turn));
  else if (isHuman(S.turn)) text = humans().length === 1 ? t('yourTurn') : t('yourTurnName', playerName(S.turn));
  else text = '';
  const prev = lastMsg ? t(lastMsg.key, ...(lastMsg.key.startsWith('cpu') ? [playerName(lastMsg.args[0]), ...lastMsg.args.slice(1)] : lastMsg.args)) : '';
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusMeta').textContent = [t('meta', S.round), prev].filter(Boolean).join(' · ');
  const meter = document.getElementById('openMeter');
  if (myTurn && !S.opened[S.turn]) {
    const ps = new Set(turnStart.rack.filter(id => !S.racks[S.turn].includes(id)));
    const val = S.table.filter(m => m.some(id => ps.has(id)) && R.meldInfo(m).ok).reduce((s, m) => s + R.meldInfo(m).value, 0);
    meter.style.display = '';
    document.getElementById('openText').textContent = t('openNeed', val);
    document.getElementById('openBar').style.width = Math.min(100, val / 30 * 100) + '%';
  } else meter.style.display = 'none';

  // buttons
  const changed = myTurn && (S.racks[S.turn].length !== turnStart.rack.length || JSON.stringify(S.table) !== JSON.stringify(turnStart.table));
  document.getElementById('drawBtn').textContent = S.pool.length ? t('draw') : t('pass');
  document.getElementById('drawBtn').disabled = !myTurn || changed;
  document.getElementById('doneBtn').disabled = !myTurn || !changed;
  document.getElementById('resetBtn').disabled = !changed;
  document.getElementById('hintBtn').disabled = !myTurn;
  const pb = document.getElementById('playBtn');
  const hintPending = hintMove && hintIds.size > 0;
  pb.textContent = selected.size ? t('playSel', selected.size) : hintPending ? t('playHint') : t('play');
  pb.disabled = !myTurn || (!selected.size && !hintPending);
  pb.title = t('playTip');
  document.getElementById('sortNumBtn').disabled = v < 0;
  document.getElementById('sortColBtn').disabled = v < 0;
  const hb = document.getElementById('hintBox');
  if (myTurn && hintLines) {
    const sep = SillyI18n.lang === 'en' ? ', ' : '、';
    hb.innerHTML = `<div class="hint-title">${t('hint')}</div>` + (hintLines.length
      ? hintLines.map(l => `<div><b>${l.tiles.map(tileName).join(sep)}</b> <span style="white-space:nowrap">→ ${t(l.kind)}</span></div>`).join('') + (hintStale ? `<div class="hint-note">${t('hintStale')}</div>` : '')
      : hintUnder ? `<div>${t('hintUnder', hintUnder.melds.map(m => m.map(tileName).join(sep)).join(' ／ '), hintUnder.value)}</div>` : `<div>${t('hintNone')}</div>`);
    hb.style.display = '';
  } else hb.style.display = 'none';
  alignHint();
  const st = getStats(), hs = humans();
  document.getElementById('recordText').textContent = hs.length === 1 ? t('record', st.wins || 0, st.losses || 0) : hs.length > 1 ? t('noRecord') : '';
}

// line the hint card up with the rack (desktop layout only)
function alignHint() {
  const hb = document.getElementById('hintBox'), rw = document.querySelector('.rack-wrap');
  hb.style.marginTop = ''; hb.style.minHeight = '';
  if (hb.style.display === 'none' || window.innerWidth <= 860) return;
  const gap = rw.getBoundingClientRect().top - hb.getBoundingClientRect().top;
  if (gap > 0) hb.style.marginTop = gap + 'px';
  hb.style.minHeight = rw.getBoundingClientRect().height + 'px';
}
window.addEventListener('resize', alignHint);

function renderSetupPreview() {
  document.getElementById('players').innerHTML = '';
  document.getElementById('table').innerHTML = `<div class="table-empty-hint">${t('tableEmpty')}</div>`;
  document.getElementById('rack').innerHTML = '';
  document.getElementById('statusText').textContent = t('chooseSettings');
  document.getElementById('statusMeta').textContent = '';
  document.getElementById('poolNum').textContent = 106;
  ['drawBtn', 'doneBtn', 'resetBtn', 'hintBtn', 'playBtn', 'sortNumBtn', 'sortColBtn'].forEach(id => document.getElementById(id).disabled = true);
  document.getElementById('drawBtn').textContent = t('draw');
  document.getElementById('playBtn').textContent = t('play');
}

let toastTimer = null;
function toast(msg, ms = 2600) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// ═══════════════════════════════════════════════
//  INPUT — tap to select, tap a set to place; or drag & drop
// ═══════════════════════════════════════════════
let drag = null;
document.addEventListener('pointerdown', e => {
  const tile = e.target.closest('.tile[data-id]');
  if (!tile || !S || phase !== 'play' || busy || !isHuman(S.turn) || tile.closest('.modal')) return;
  const id = +tile.dataset.id;
  drag = { id, x0: e.clientX, y0: e.clientY, active: false, el: tile };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.active && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 7) {
    if (!canMove(drag.id)) { Sound.bad(); toast(t('errLocked')); drag = null; return; }
    drag.ids = selected.has(drag.id) ? [...selected] : [drag.id];
    drag.active = true;
    drag.ghosts = drag.ids.map((id, k) => {
      const g = document.createElement('div');
      g.innerHTML = tileHTML(id, 'ghost');
      const el = g.firstChild; el.dataset.k = k;
      document.body.appendChild(el);
      return el;
    });
    drag.ids.forEach(id => document.querySelectorAll(`.tile[data-id="${id}"]`).forEach(el => el.classList.add('dragging-src')));
  }
  if (drag.active) {
    const w = drag.ghosts[0].offsetWidth;
    drag.ghosts.forEach((g, k) => { g.style.left = (e.clientX - w / 2 + k * (w + 3)) + 'px'; g.style.top = (e.clientY - g.offsetHeight / 2) + 'px'; });
    document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
    const tgt = dropTarget(e.clientX, e.clientY);
    if (tgt && tgt.el) tgt.el.classList.add('drop-hover');
    e.preventDefault();
  }
});
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.active) {
    d.ghosts.forEach(g => g.remove());
    document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
    const tgt = dropTarget(e.clientX, e.clientY);
    if (tgt) moveTiles(d.ids, tgt.target); else render();
    return;
  }
  // a tap on a tile: if tiles are selected and this tile sits in another set, place them there
  const loc = locate(d.id);
  if (selected.size && !selected.has(d.id) && loc && loc.where === 'table' && ![...selected].some(id => S.table[loc.meld].includes(id))) {
    moveTiles([...selected], { meld: loc.meld }); return;
  }
  if (!canMove(d.id)) { Sound.bad(); toast(t('errLocked')); return; }
  selected.has(d.id) ? selected.delete(d.id) : selected.add(d.id);
  Sound.tap();
  render();
});
function dropTarget(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const meld = el.closest('.meld[data-meld]');
  if (meld) return { el: meld, target: { meld: +meld.dataset.meld } };
  const nm = el.closest('#newMeld');
  if (nm) return { el: nm, target: { newMeld: true } };
  if (el.closest('#table')) return { el: document.getElementById('newMeld'), target: { newMeld: true } };
  if (el.closest('.rack-wrap')) return { el: document.getElementById('rack'), target: { rack: true } };
  return null;
}
// taps on empty places while tiles are selected
document.getElementById('table').addEventListener('click', e => {
  if (!selected.size || e.target.closest('.tile')) return;
  const meld = e.target.closest('.meld[data-meld]');
  moveTiles([...selected], meld ? { meld: +meld.dataset.meld } : { newMeld: true });
});
document.querySelector('.rack-wrap').addEventListener('click', e => {
  if (!selected.size || e.target.closest('.tile')) return;
  if ([...selected].some(id => locate(id) && locate(id).where === 'table')) moveTiles([...selected].filter(id => locate(id).where === 'table'), { rack: true });
});

document.getElementById('sortNumBtn').addEventListener('click', () => { if (viewer() < 0) return; rackSort = 'num'; sortRack(S.racks[viewer()], 'num'); Sound.tap(); render(); });
document.getElementById('sortColBtn').addEventListener('click', () => { if (viewer() < 0) return; rackSort = 'col'; sortRack(S.racks[viewer()], 'col'); Sound.tap(); render(); });
document.getElementById('resetBtn').addEventListener('click', () => resetTurn(false));
document.getElementById('drawBtn').addEventListener('click', humanDraw);
document.getElementById('doneBtn').addEventListener('click', humanDone);
document.addEventListener('keydown', e => {
  if (document.querySelector('.overlay.active')) return;
  if (e.key === 'Escape') { selected.clear(); render(); }
  if (e.key === 'Enter') humanDone();
  if (e.key === 'h' || e.key === 'H') showHint();
});

// ═══════════════════════════════════════════════
//  SAVE / STATS
// ═══════════════════════════════════════════════
function save() { try { localStorage.setItem(GAME_KEY, JSON.stringify({ settings, S: Object.assign({}, S, { table: turnStart ? turnStart.table : S.table, racks: S.racks.map((r, p) => p === S.turn && turnStart ? turnStart.rack : r) }) })); } catch (e) {} }
function clearSave() { try { localStorage.removeItem(GAME_KEY); } catch (e) {} }
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(GAME_KEY)); if (s && s.S && Array.isArray(s.S.racks) && !s.S.over) return s; } catch (e) {}
  return null;
}
function getStats() { try { return JSON.parse(localStorage.getItem(STATS_KEY)) || { wins: 0, losses: 0 }; } catch (e) { return { wins: 0, losses: 0 }; } }
function sf() { try { return typeof SillyFirebase !== 'undefined' ? SillyFirebase : null; } catch (e) { return null; } }
function recordResult(won) {
  const s = getStats();
  s.wins = (s.wins || 0) + (won ? 1 : 0); s.losses = (s.losses || 0) + (won ? 0 : 1); s.savedAt = Date.now();
  const fb = sf(); if (fb && fb.currentUser) s.uid = fb.currentUser.uid;
  try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch (e) {}
  if (fb) fb.saveProgress('rummikub', s);
}

// ═══════════════════════════════════════════════
//  SETUP & OVERLAYS
// ═══════════════════════════════════════════════
function renderSeats() {
  const box = document.getElementById('seats');
  box.innerHTML = [...Array(settings.n).keys()].map(p => `
    <div class="seat-row">
      <div class="dot" style="background:${SEAT_COLORS[p]}"></div>
      <div class="seat-name">${t('colors')[p]}</div>
      <div class="pills" data-seat="${p}">
        <div class="pill ${settings.seats[p] === 'human' ? 'active' : ''}" data-val="human">${t('human')}</div>
        <div class="pill ${settings.seats[p] === 'cpu' ? 'active' : ''}" data-val="cpu">${t('cpu')}</div>
      </div>
    </div>`).join('');
  box.querySelectorAll('.pills').forEach(g => g.addEventListener('click', e => {
    const pill = e.target.closest('.pill'); if (!pill) return;
    settings.seats[+g.dataset.seat] = pill.dataset.val; renderSeats();
  }));
  document.getElementById('levelOpt').style.display = settings.seats.slice(0, settings.n).includes('cpu') ? '' : 'none';
}
document.querySelectorAll('.pills[data-group]').forEach(group => group.addEventListener('click', e => {
  const pill = e.target.closest('.pill'); if (!pill) return;
  group.querySelectorAll('.pill').forEach(p => p.classList.remove('active')); pill.classList.add('active');
  if (group.dataset.group === 'n') { settings.n = +pill.dataset.val; renderSeats(); }
  if (group.dataset.group === 'level') settings.level = pill.dataset.val;
}));
function syncPills() {
  const set = (g, v) => document.querySelectorAll(`.pills[data-group="${g}"] .pill`).forEach(p => p.classList.toggle('active', p.dataset.val === String(v)));
  set('n', settings.n); set('level', settings.level); renderSeats();
}
function closeOverlays() { document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active')); }
function openSetup() {
  closeOverlays();
  document.getElementById('continueBtn').style.display = phase === 'setup' && loadSave() ? '' : 'none';
  document.getElementById('cancelSetupBtn').style.display = phase === 'play' ? '' : 'none';
  renderSeats();
  document.getElementById('setupOverlay').classList.add('active');
}
function showCover() {
  render();
  document.getElementById('coverTitle').textContent = t('coverTitle', playerName(S.turn));
  document.getElementById('rack').innerHTML = '';
  document.getElementById('coverOverlay').classList.add('active');
}
document.getElementById('coverBtn').addEventListener('click', () => { closeOverlays(); render(); });
document.getElementById('startBtn').addEventListener('click', () => { Sound.tap(); newGame(); });
document.getElementById('continueBtn').addEventListener('click', () => {
  const s = loadSave(); if (!s) return;
  settings = Object.assign(settings, s.settings); S = s.S; phase = 'play'; syncPills(); closeOverlays(); beginTurn();
});
document.getElementById('cancelSetupBtn').addEventListener('click', () => { closeOverlays(); if (S && !isHuman(S.turn) && !cpuTimer) beginTurn(); });
document.getElementById('newGameBtn').addEventListener('click', () => { if (phase === 'play' && busy) cancelCpu(); openSetup(); });
document.getElementById('howToPlayBtn').addEventListener('click', () => { document.getElementById('helpOverlay').classList.add('active'); });
document.getElementById('helpCloseBtn').addEventListener('click', () => document.getElementById('helpOverlay').classList.remove('active'));
document.getElementById('playAgainBtn').addEventListener('click', () => { phase = 'setup'; S = null; render(); openSetup(); });
document.getElementById('reviewBtn').addEventListener('click', closeOverlays);
document.getElementById('exitBtn').addEventListener('click', () => window.location.href = '../../');
document.getElementById('resultExitBtn').addEventListener('click', () => window.location.href = '../../');
document.getElementById('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  const b = document.getElementById('soundBtn'); b.textContent = soundOn ? '🔊' : '🔇'; b.classList.toggle('muted', !soundOn);
});
SillyI18n.onChange(() => {
  renderSeats(); render(); renderResult();
  if (S && document.getElementById('coverOverlay').classList.contains('active')) document.getElementById('coverTitle').textContent = t('coverTitle', playerName(S.turn));
});

// ═══════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════
(function boot() {
  const s = loadSave();
  if (s) settings = Object.assign(settings, s.settings);
  document.getElementById('setupTiles').innerHTML = [0 * 13 + 6, 13 + 7, 2 * 13 + 8].map(id => tileHTML(id)).join('') + tileHTML(104);
  syncPills();
  render();
  openSetup();
})();
