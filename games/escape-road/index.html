<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Escape Road</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d1a; --surface: #14142b; --border: #2a2a50;
      --accent: #7c3aed; --accent2: #06b6d4; --text: #e2e8f0; --muted: #64748b;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; user-select: none;
      overflow-x: hidden;
    }
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 1.5rem; height: 54px; display: flex; align-items: center; gap: 1rem; flex-shrink: 0;
    }
    .topbar .brand { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
    .topbar .brand a { color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
    .topbar .brand a:hover { color: var(--text); }
    .topbar .sep { color: var(--muted); }
    .topbar-actions { margin-left: auto; display: flex; gap: 0.6rem; align-items: center; }
    .btn {
      padding: 0.45rem 1rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.85; transform: scale(1.02); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--accent); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #5b21b6); color: #fff; }
    .btn-danger { background: linear-gradient(135deg, #dc2626, #991b1b); color: #fff; }
    .btn-online { background: linear-gradient(135deg, #06b6d4, #0e7490); color: #fff; }

    .game-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 1.5rem; gap: 1.5rem; }
    .sidebar { display: flex; flex-direction: column; gap: 1rem; width: 140px; }
    .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; }
    .stat-label { font-size: 0.7rem; font-weight: 600; color: var(--muted); margin-bottom: 0.3rem; }
    .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--accent2); font-variant-numeric: tabular-nums; }
    .stat-value.gold { color: #fbbf24; }
    .stat-value.red { color: #f87171; }
    .tip-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; font-size: 0.75rem; color: var(--muted); line-height: 1.7; }
    .hp-bar { height: 12px; border-radius: 6px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 0.35rem; }
    .hp-bar i { display: block; height: 100%; width: 100%; border-radius: 6px; background: linear-gradient(90deg, #22c55e, #84cc16); transition: width .15s; }
    .stars { font-size: 1.35rem; letter-spacing: 2px; color: #fbbf24; }
    .stars .off { color: rgba(255,255,255,0.15); }
    #miniMap { display: block; width: 100%; aspect-ratio: 1; border-radius: 8px; background: #0b2540; margin-top: 0.3rem; }

    #gameCanvas { border-radius: 12px; border: 2px solid var(--border); display: block; touch-action: none; background: #1e5f99; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82); backdrop-filter: blur(6px); z-index: 200; align-items: center; justify-content: center; }
    .overlay.active { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 2rem 2.2rem; max-width: 580px; width: 92%; text-align: center; max-height: 94vh; overflow-y: auto; }
    .modal h2 { font-size: 1.7rem; font-weight: 800; margin-bottom: 0.4rem; }
    .modal .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.2rem; }
    .modal .instructions { background: var(--bg); border-radius: 10px; padding: 1rem; text-align: left; margin-bottom: 1rem; }
    .modal .instructions h3 { font-size: 0.8rem; font-weight: 700; color: var(--accent2); margin-bottom: 0.6rem; }
    .modal .instructions ul { list-style: none; font-size: 0.84rem; color: var(--muted); display: flex; flex-direction: column; gap: 0.45rem; }
    .modal .instructions li { display: flex; align-items: flex-start; gap: 0.6rem; }
    .modal .instructions .icon { font-size: 1.1rem; flex-shrink: 0; margin-top: -1px; }
    .modal-score { font-size: 2.8rem; font-weight: 900; color: var(--accent2); margin: 0.4rem 0; }
    .modal-buttons { display: flex; gap: 0.7rem; justify-content: center; margin-top: 1rem; }
    .modal-buttons .btn { white-space: nowrap; font-size: 1rem; padding: 0.7rem 1.4rem; }
    @media (max-width: 480px) { .modal-buttons { gap: 0.4rem; } .modal-buttons .btn { padding: 0.6rem 0.7rem !important; font-size: 0.92rem !important; } .modal { padding: 1.3rem 1.1rem; } }
    .best-line { color: #fde68a; font-weight: 700; margin-top: -0.4rem; margin-bottom: 0.6rem; min-height: 1.2em; }

    .pause-badge { display: none; position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(124,58,237,0.92); color: #fff; font-weight: 700; font-size: 0.9rem; padding: 0.4rem 1.4rem; border-radius: 50px; z-index: 150; pointer-events: none; }
    .pause-badge.visible { display: block; }

    /* online race */
    #raceBoard { display: none; }
    body.racing #raceBoard { display: block; }
    body.racing .solo-only, body.racing #pauseBtn, body.racing #restartBtn, body.racing #howToPlayBtn { display: none !important; }
    .rb-title { font-size: 0.95rem; font-weight: 700; color: #aab4c5; margin-bottom: 0.5rem; }
    .rb-row { padding: 0.45rem 0; border-top: 1px solid var(--border); }
    .rb-row:first-of-type { border-top: none; }
    .rb-top { display: flex; align-items: center; gap: 0.45rem; font-size: 0.95rem; font-weight: 700; }
    .rb-top .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .rb-top .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #eef2f7; }
    .rb-top .ct { font-variant-numeric: tabular-nums; color: #fbbf24; }
    .rb-sub { font-size: 0.8rem; color: #aab4c5; margin-top: 0.2rem; }
    .rb-note { font-size: 0.85rem; color: #fde68a; margin-top: 0.5rem; line-height: 1.5; }
    .race-table { width: 100%; border-collapse: collapse; margin: 0.6rem 0 0.4rem; font-size: 0.98rem; }
    .race-table th { color: #aab4c5; font-weight: 700; font-size: 0.85rem; padding: 0.35rem 0.4rem; text-align: left; border-bottom: 1px solid var(--border); }
    .race-table td { padding: 0.45rem 0.4rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .race-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .race-table tr.me td { color: #67e8f9; font-weight: 700; }
    .race-table tr.top td:first-child { color: #fbbf24; }
    .race-next { color: #aab4c5; font-size: 0.92rem; margin-top: 0.4rem; }
    .race-toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: rgba(14,116,144,0.95); color: #fff; padding: 0.6rem 1.2rem; border-radius: 14px; font-weight: 800; z-index: 300; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .race-toast.show { opacity: 1; }
    #game-avatar { display: flex; align-items: center; margin-left: 0.5rem; }

    /* phones and small tablets: canvas on top, cards below */
    @media (max-width: 900px) {
      .topbar { padding: 0 0.6rem; gap: 0.4rem; }
      .topbar .brand a { display: none; } .topbar .brand .sep { display: none; }
      .topbar-actions { gap: 0.3rem; }
      .topbar-actions .btn { padding: 0.4rem 0.55rem; font-size: 0.8rem; }
      .game-wrapper { flex-direction: column; padding: 0.5rem; gap: 0.6rem; justify-content: flex-start; }
      .game-wrapper .sidebar { width: 100% !important; flex-direction: row; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
      .sidebar .tip-box, .sidebar .hide-narrow { display: none !important; }
      .sidebar .stat-box { flex: 1 1 140px; }
      .sidebar.left { display: none; }
      .topbar-actions .btn { white-space: nowrap; }
    }
    @media (max-width: 600px) {
      .topbar .brand, #howToPlayBtn { display: none; }
      .topbar-actions { margin-left: 0; width: 100%; justify-content: flex-end; }
      #game-avatar { display: none; }
    }
  </style>

<script>
// ═══════════════════════════════════════════════
//  WORLD
// ═══════════════════════════════════════════════
const CELL = 40, BLOCK = 6, PERIOD = 8, NB = 10, MARGIN = 4;
const C0 = MARGIN, C1 = MARGIN + NB * PERIOD + 2;      // city cells [C0, C1)
const GW = C1 + MARGIN;                                 // grid is GW × GW cells
const WORLD = GW * CELL;
const T_WATER = 0, T_ROAD = 1, T_BUILD = 2, T_GRASS = 3, T_TREE = 4, T_ALLEY = 5, T_SAND = 6, T_RAIL = 7;
const STEP = 1000 / 60;
const RACE_SEC = 90, RACE_FRAMES = RACE_SEC * 60;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let CW = 640, CH = 540;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let grid = new Uint8Array(GW * GW), buildings = [], treeList = [], citySeed = 0;

// ── distance field from the player's cell (police follow it downhill) ──
function computeDist() {

  if (!passT(cellAt(cx, cy))) {           // e.g. pushed against a wall: start from the nearest open cell
    let found = false;
    for (let r = 1; r < 3 && !found; r++) for (let dy = -r; dy <= r && !found; dy++) for (let dx = -r; dx <= r && !found; dx++)
      if (passT(cellAt(cx + dx, cy + dy))) { cx += dx; cy += dy; found = true; }
  }
  let h = 0, t = 0;

  while (h < t) {
    const k = q[h++], x = k % GW, y = (k / GW) | 0, dv = dist[k] + 1;
    if (dv > 120) continue;
    if (x > 0) { const n = k - 1; if (dist[n] < 0 && passT(grid[n])) { dist[n] = dv; q[t++] = n; } }
    if (x < GW - 1) { const n = k + 1; if (dist[n] < 0 && passT(grid[n])) { dist[n] = dv; q[t++] = n; } }
    if (y > 0) { const n = k - GW; if (dist[n] < 0 && passT(grid[n])) { dist[n] = dv; q[t++] = n; } }
    if (y < GW - 1) { const n = k + GW; if (dist[n] < 0 && passT(grid[n])) { dist[n] = dv; q[t++] = n; } }

    if (nx < 0 || ny < 0 || nx >= GW || ny >= GW) continue;

// ── police brain ──
function policeAI(p) {

  if (p.rev > 0) { p.rev--; drive(p, p.revSteer, -2.2); return; }
  const dx = player.x - p.x, dy = player.y - p.y, d = Math.hypot(dx, dy);

  drive(p, steer, max * (Math.abs(diff) > 1.3 ? 0.5 : Math.abs(diff) > 0.6 ? 0.8 : 1));

// ── traffic: wanders the streets ──

  const cx = Math.floor(c.x / CELL), cy = Math.floor(c.y / CELL);
  if (!c.goal || Math.hypot(c.goal[0] - c.x, c.goal[1] - c.y) < 16) {
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => cellAt(cx + dx, cy + dy) === T_ROAD);
    let pick = dirs.filter(([dx, dy]) => !(c.dir && dx === -c.dir[0] && dy === -c.dir[1]));
    if (!pick.length) pick = dirs;

    const dir = keep && Math.random() < 0.8 ? keep : pick[Math.floor(Math.random() * pick.length)] || [1, 0];
    c.dir = dir;

function explode(p) {
  for (let i = 0; i < 30; i++) { const a = Math.random() * 6.28, s = 1 + Math.random() * 5; particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color: i % 3 ? '#f97316' : '#fde047', r: 3 + Math.random() * 3 }); }
  wrecks.push({ kind: 'wreck', x: p.x, y: p.y, a: p.a, r: p.r, vx: 0, vy: 0, m: 99, life: 60 * 12, swat: p.kind === 'swat' });
  const bonus = p.kind === 'swat' ? 100 : 50;
  if (gameState === 'running' && p.kind !== 'player') { cash += bonus; floats.push({ x: p.x, y: p.y - 24, text: `WRECKED +$${bonus}`, color: '#fde047', life: 1.4 }); }
  Sound.boom(); shake = Math.max(shake, 10);
}
function hurtPlayer(n) {
  if (n <= 0 || gameState !== 'running') return;
  player.hp = Math.max(0, player.hp - n);
  shake = Math.max(shake, Math.min(10, n));
}

// ═══════════════════════════════════════════════
//  UPDATE (one fixed 1/60 s step)
// ═══════════════════════════════════════════════
function updateGame() {
  runFrames++;
  const left = keys.ArrowLeft || keys.KeyA || (touch.l && !touch.r);
  const right = keys.ArrowRight || keys.KeyD || (touch.r && !touch.l);
  const brake = keys.ArrowDown || keys.KeyS || (touch.l && touch.r);
  const boost = keys.ArrowUp || keys.KeyW;
  const steer = (left ? -1 : 0) + (right ? 1 : 0);
  player.turn = boost ? 0.052 : brake ? 0.075 : 0.064;
  const target = brake ? (player.spd > 0.6 ? 0 : -2.4) : boost ? P_BOOST : P_BASE;
  drive(player, steer, target);
  // tyre marks when sliding
  const sp = Math.hypot(player.vx, player.vy);
  const slip = Math.abs(-Math.sin(player.a) * player.vx + Math.cos(player.a) * player.vy);
  if (slip > 1.4 && sp > 2) { skids.push({ x: player.x, y: player.y, a: player.a, life: 1 }); if (skids.length > 260) skids.shift(); }
  const hit = collideWorld(player, false);
  if (hit > 1.6) { hurtPlayer((hit - 1.6) * 5); sparks(player.x, player.y, 6, '#fde047'); Sound.crash(hit / 2); }
  const tHere = typeAt(player.x, player.y);
  if (tHere === T_WATER) return endRun('drowned');

  // wanted level
  const s = starNow();
  if (s > star) { star = s; Sound.star(); floats.push({ x: player.x, y: player.y - 40, text: '★'.repeat(star), color: '#fbbf24', life: 1.5 }); if (star >= 5 && !heli) heli = { x: player.x - 300, y: player.y - 300 }; }

  // police
  if (--spawnT <= 0) { spawnT = 120; if (police.filter(p => !p.parked).length < MAX_POLICE[star]) spawnPolice(); }
  if (star >= 4 && ++blockT > 60 * 14) { blockT = 0; spawnRoadblock(); }
  for (const p of police) {
    policeAI(p);
    const h = collideWorld(p, true);
    if (h > 2.6 && !p.parked) { p.hp -= p.kind === 'swat' ? 0.5 : 1; sparks(p.x, p.y, 4, '#fde047'); }
    if (p.parked && --p.life <= 0) p.hp = -99;
    if (!p.parked && Math.hypot(p.x - player.x, p.y - player.y) > 1500) {   // lost track: come back from somewhere near
      const q = randomCellNear(600, 820, t => t === T_ROAD, true); if (q) { p.x = q.x; p.y = q.y; p.vx = p.vy = 0; }
    }
  }
  for (const c of civs) { civAI(c); collideWorld(c, true); }
  // every car against every car
  const all = [player, ...police, ...civs, ...wrecks];
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j];
    const rv = collideCars(a, b);
    if (rv < 0.9) continue;
    const isP = a === player || b === player, o = a === player ? b : a;
    if (isP) {
      if (o.kind === 'police' || o.kind === 'swat') {
        hurtPlayer(rv * (o.kind === 'swat' ? 4 : 2.2));
        o.hp -= rv * (o.kind === 'swat' ? 0.15 : 0.42);
        if (rv > 2) { Sound.crash(rv / 2); sparks((a.x + b.x) / 2, (a.y + b.y) / 2, 8, '#fde047'); }
      } else if (o.kind === 'civ') { hurtPlayer(rv * 1.2); o.stun = 70; if (rv > 2) Sound.crash(rv / 3); }
      else if (o.kind === 'wreck') hurtPlayer(rv * 1.5);
    } else {
      const cop = k => k === 'police' || k === 'swat';
      if (cop(a.kind) && (cop(b.kind) || b.kind === 'wreck') && rv > 1.6) { a.hp -= 0.7; if (cop(b.kind)) b.hp -= 0.7; sparks((a.x + b.x) / 2, (a.y + b.y) / 2, 5, '#fde047'); }
      if (a.kind === 'civ') a.stun = 60; if (b.kind === 'civ') b.stun = 60;
    }
  }
  for (const p of police) if (p.hp <= 0) { if (p.hp > -50) explode(p); p.dead = true; }
  police = police.filter(p => !p.dead);
  for (const w of wrecks) { w.life--; if (w.life % 9 === 0 && w.life > 60 * 6) smoke(w.x, w.y); }
  wrecks = wrecks.filter(w => w.life > 0);
  civs = civs.filter(c => Math.hypot(c.x - player.x, c.y - player.y) < 1150);
  while (civs.length < 10) { const n = civs.length; spawnCiv(false); if (civs.length === n) break; }

  // pickups
  for (const c of coins) if (Math.hypot(c.x - player.x, c.y - player.y) < 28) {
    c.got = true; cash += c.v; Sound.coin();
    floats.push({ x: c.x, y: c.y - 16, text: '+$' + c.v, color: '#fde047', life: 1 });
  }
  coins = coins.filter(c => !c.got && Math.hypot(c.x - player.x, c.y - player.y) < 1300);
  while (coins.length < 24) { const n = coins.length; spawnCoin(false); if (coins.length === n) break; }
  if (!wrench && player.hp < 85 && runFrames - lastWrench > 60 * 18) {
    const q = randomCellNear(300, 650, t => t === T_ROAD, false); if (q) wrench = q;
  }
  if (wrench && Math.hypot(wrench.x - player.x, wrench.y - player.y) < 30) {
    player.hp = Math.min(100, player.hp + 35); wrench = null; lastWrench = runFrames; Sound.repair();
    floats.push({ x: player.x, y: player.y - 30, text: 'REPAIRED +35', color: '#4ade80', life: 1.2 });
  }
  if (wrench && Math.hypot(wrench.x - player.x, wrench.y - player.y) > 1400) wrench = null;

  // busted? stopped with a cop touching you
  let near = 0;
  for (const p of police) if (Math.hypot(p.x - player.x, p.y - player.y) < p.r + player.r + 12) near++;
  if (near && sp < 1.15) bustT += near > 1 ? 2 : 1; else bustT = Math.max(0, bustT - 3);
  if (bustT >= 100) return endRun('busted');
  if (player.hp <= 0) { explode(player); return endRun('wrecked'); }
  if (player.hp < 35 && frame % 10 === 0) smoke(player.x, player.y);

  if (heli) { heli.x += (player.x - heli.x) * 0.03; heli.y += (player.y - 30 - heli.y) * 0.03; }
  if (runFrames % 20 === 0) computeDist();
  if (--sirenT <= 0) { sirenT = 30; Sound.siren(police.some(p => !p.parked && Math.hypot(p.x - player.x, p.y - player.y) < 420)); }
  if (isRace()) { Race.tick(); if (runFrames >= RACE_FRAMES) return endRun('escaped'); }
  if (runFrames % 6 === 0) updateUI();
}

function updateCamera(tx, ty, vx, vy) {
  const lx = tx + vx * 20, ly = ty + vy * 20;
  camX += (lx - camX) * 0.1; camY += (ly - camY) * 0.1;
  camX = Math.max(CW / 2, Math.min(WORLD - CW / 2, camX));
  camY = Math.max(CH / 2, Math.min(WORLD - CH / 2, camY));
}
function updateFx() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life -= p.color === 'smoke' ? 0.015 : 0.035; if (p.color === 'smoke') p.r += 0.25; }
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 400) particles.splice(0, particles.length - 400);
  for (const f of floats) { f.y -= 0.6; f.life -= 0.018; }
  floats = floats.filter(f => f.life > 0);
  for (const s of skids) s.life -= 0.004;
  skids = skids.filter(s => s.life > 0);
  if (shake > 0) shake *= 0.85; if (shake < 0.3) shake = 0;
}

function endRun(reason) {
  endReason = reason; bustT = reason === 'busted' ? 100 : bustT;
  if (reason === 'escaped') Sound.win(); else Sound.bust();
  updateUI();
  if (isRace()) { Race.finish(reason); return; }
  gameState = 'busted'; overT = 0;
}

function showResult() {
  const sc = scoreOf();
  const isBest = !best || sc > best.score;
  if (isBest) { best = { score: sc, time: runFrames, cash }; try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {} }
  document.getElementById('resultTitle').textContent = SillyI18n.t(endReason);
  document.getElementById('resultSubtitle').textContent = isBest ? SillyI18n.t('newBest') : SillyI18n.t('bestWas', best.score);
  document.getElementById('finalScore').textContent = sc;
  document.getElementById('resultDetail').textContent = SillyI18n.t('resultDetail', fmtTime(runFrames), cash) + ' · ' + SillyI18n.t('scoreRule');
  document.getElementById('resultOverlay').classList.add('active');
  updateUI();
}

// ═══════════════════════════════════════════════
//  DRAWING
// ═══════════════════════════════════════════════
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function drawGround(vx0, vy0, vx1, vy1) {
  const cx0 = Math.max(0, Math.floor(vx0 / CELL)), cy0 = Math.max(0, Math.floor(vy0 / CELL));
  const cx1 = Math.min(GW - 1, Math.floor(vx1 / CELL)), cy1 = Math.min(GW - 1, Math.floor(vy1 / CELL));
  const COL = { [T_WATER]: '#1e5f99', [T_ROAD]: '#3b3f4a', [T_BUILD]: '#8b919c', [T_GRASS]: '#3f7d3a', [T_TREE]: '#3f7d3a', [T_ALLEY]: '#555a66', [T_SAND]: '#cdb67c', [T_RAIL]: '#cdb67c' };
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    const t = grid[cy * GW + cx];
    ctx.fillStyle = COL[t];
    ctx.fillRect(cx * CELL, cy * CELL, CELL + 0.5, CELL + 0.5);
    if (t === T_RAIL) {
      ctx.fillStyle = '#6b7280'; ctx.fillRect(cx * CELL + 8, cy * CELL + 8, CELL - 16, CELL - 16);
      ctx.fillStyle = (cx + cy) % 2 ? '#ef4444' : '#f8fafc'; ctx.fillRect(cx * CELL + 11, cy * CELL + 11, CELL - 22, CELL - 22);
    } else if (t === T_WATER) {
      const w = Math.sin(frame * 0.04 + cx * 0.9 + cy * 0.6);
      if (w > 0.7) { ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx * CELL + 8, cy * CELL + 20); ctx.quadraticCurveTo(cx * CELL + 20, cy * CELL + 14, cx * CELL + 32, cy * CELL + 20); ctx.stroke(); }
    } else if (t === T_ROAD) {
      const i = (cx - C0) % PERIOD, j = (cy - C0) % PERIOD;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      if (i === 0 && j >= 2) for (let k = 0; k < 2; k++) ctx.fillRect(cx * CELL + CELL - 1.5, cy * CELL + 4 + k * 20, 3, 11);
      if (j === 0 && i >= 2) for (let k = 0; k < 2; k++) ctx.fillRect(cx * CELL + 4 + k * 20, cy * CELL + CELL - 1.5, 11, 3);
      // zebra crossings at the edges of crossings
      if (i < 2 && (j === 2 || j === PERIOD - 1) && cy < C1 - 1) { ctx.fillStyle = 'rgba(255,255,255,0.22)'; for (let k = 0; k < 4; k++) ctx.fillRect(cx * CELL + 4 + k * 9, cy * CELL + (j === 2 ? 2 : CELL - 9), 5, 7); }
      if (j < 2 && (i === 2 || i === PERIOD - 1)) { ctx.fillStyle = 'rgba(255,255,255,0.22)'; for (let k = 0; k < 4; k++) ctx.fillRect(cx * CELL + (i === 2 ? 2 : CELL - 9), cy * CELL + 4 + k * 9, 7, 5); }
    }
  }
}
function drawBuildings(vx0, vy0, vx1, vy1) {
  for (const b of buildings) {
    if (b.x > vx1 || b.x + b.w < vx0 || b.y - b.z > vy1 || b.y + b.h < vy0) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(b.x + 7, b.y + 7, b.w, b.h);
    ctx.fillStyle = shade(b.color, 0.6); ctx.fillRect(b.x, b.y + b.h - b.z, b.w, b.z);          // front wall
    // windows on the wall
    ctx.fillStyle = 'rgba(253,230,138,0.35)';
    for (let wx = b.x + 6; wx < b.x + b.w - 8; wx += 14) ctx.fillRect(wx, b.y + b.h - b.z + 3, 7, Math.max(3, b.z - 7));
    ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y - b.z, b.w, b.h);                             // roof
    ctx.strokeStyle = shade(b.color, 1.25); ctx.lineWidth = 3; ctx.strokeRect(b.x + 1.5, b.y - b.z + 1.5, b.w - 3, b.h - 3);
    if (b.det < 0.5 && b.w > 50 && b.h > 50) { ctx.fillStyle = shade(b.color, 0.8); ctx.fillRect(b.x + b.w * 0.25, b.y - b.z + b.h * 0.3, 18, 14); ctx.fillRect(b.x + b.w * 0.6, b.y - b.z + b.h * 0.55, 14, 14); }
    else if (b.det > 0.8 && b.w > 40) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = 'bold 18px Segoe UI, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('H', b.x + b.w / 2, b.y - b.z + b.h / 2); ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y - b.z + b.h / 2, 13, 0, 7); ctx.stroke(); }
  }
  for (const t of treeList) {
    if (t.x < vx0 - 30 || t.x > vx1 + 30 || t.y < vy0 - 30 || t.y > vy1 + 30) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(t.x + 5, t.y + 5, t.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#166534'; ctx.beginPath(); ctx.arc(t.x, t.y - 4, t.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(t.x - 4, t.y - 9, t.r * 0.5, 0, 7); ctx.fill();
  }
}
function drawCar(c, alpha = 1) {
  const L = c.r * 2.6, W = c.r * 1.5;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(c.x, c.y); ctx.rotate(c.a);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(-L / 2 + 3, -W / 2 + 4, L, W, 5); ctx.fill();
  const k = c.kind;
  if (k === 'wreck') {
    ctx.fillStyle = '#292524'; rr(-L / 2, -W / 2, L, W, 5); ctx.fill();
    ctx.fillStyle = '#44403c'; ctx.fillRect(-L * 0.2, -W / 2 + 3, L * 0.32, W - 6);
    ctx.restore(); return;
  }
  const body = k === 'police' ? '#f8fafc' : k === 'swat' ? '#1e293b' : c.color;
  ctx.fillStyle = body; rr(-L / 2, -W / 2, L, W, 5); ctx.fill();
  if (k === 'police') { ctx.fillStyle = '#111827'; ctx.fillRect(L * 0.18, -W / 2, L * 0.32, W); ctx.fillRect(-L / 2, -W / 2, L * 0.16, W); }
  if (k === 'swat') { ctx.fillStyle = '#334155'; ctx.fillRect(-L * 0.42, -W / 2 + 3, L * 0.62, W - 6); ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 9px Segoe UI, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('SWAT', -L * 0.1, 0); }
  // windows
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(L * 0.08, -W / 2 + 3, L * 0.14, W - 6);
  ctx.fillRect(-L * 0.36, -W / 2 + 3, L * 0.1, W - 6);
  if (k !== 'swat') { ctx.fillStyle = k === 'police' ? '#e5e7eb' : shade(c.color.startsWith('#') ? c.color : '#888888', 1.18); ctx.fillRect(-L * 0.24, -W / 2 + 3, L * 0.3, W - 6); }
  // lights
  ctx.fillStyle = '#fef9c3'; ctx.fillRect(L / 2 - 3, -W / 2 + 2, 3, 4); ctx.fillRect(L / 2 - 3, W / 2 - 6, 3, 4);
  ctx.fillStyle = '#ef4444'; ctx.fillRect(-L / 2, -W / 2 + 2, 2, 4); ctx.fillRect(-L / 2, W / 2 - 6, 2, 4);
  if (k === 'police' || k === 'swat') {
    const on = Math.floor(frame / 8) % 2 === 0;
    ctx.fillStyle = on ? '#ef4444' : '#3b82f6'; ctx.fillRect(-L * 0.1, -W / 2 + 3, 5, W / 2 - 3);
    ctx.fillStyle = on ? '#3b82f6' : '#ef4444'; ctx.fillRect(-L * 0.1, 0, 5, W / 2 - 3);
    if (!c.parked) { ctx.globalAlpha = alpha * 0.18; ctx.fillStyle = on ? '#ef4444' : '#3b82f6'; ctx.beginPath(); ctx.arc(0, 0, c.r * 2.2, 0, 7); ctx.fill(); }
  }
  if (k === 'player' || k === 'ghost') {   // racing stripes
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(-L / 2 + 2, -2, L - 4, 1.6); ctx.fillRect(-L / 2 + 2, 1, L - 4, 1.6);
  }
  ctx.restore();
}
function drawCoin(c) {
  const bob = Math.sin(frame * 0.08 + c.ph) * 2;
  if (c.v >= 50) {
    ctx.fillStyle = '#15803d'; rr(c.x - 11, c.y - 8 + bob, 22, 16, 4); ctx.fill();
    ctx.fillStyle = '#bbf7d0'; ctx.font = 'bold 12px Segoe UI, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$$', c.x, c.y + bob + 1);
  } else {
    ctx.fillStyle = '#ca8a04'; ctx.beginPath(); ctx.arc(c.x, c.y + bob, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(c.x, c.y + bob, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#a16207'; ctx.font = 'bold 11px Segoe UI, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', c.x, c.y + bob + 1);
  }
}
function drawWrench(w) {
  const bob = Math.sin(frame * 0.1) * 3;
  ctx.fillStyle = 'rgba(74,222,128,0.25)'; ctx.beginPath(); ctx.arc(w.x, w.y + bob, 18, 0, 7); ctx.fill();
  ctx.font = '22px Segoe UI Emoji, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🔧', w.x, w.y + bob);
}

function render(spect) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1e5f99'; ctx.fillRect(0, 0, CW, CH);
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  const ox = Math.round(CW / 2 - camX + sx), oy = Math.round(CH / 2 - camY + sy);
  ctx.setTransform(1, 0, 0, 1, ox, oy);
  const vx0 = camX - CW / 2 - 40, vy0 = camY - CH / 2 - 40, vx1 = camX + CW / 2 + 40, vy1 = camY + CH / 2 + 60;
  drawGround(vx0, vy0, vx1, vy1);
  for (const s of skids) { ctx.save(); ctx.globalAlpha = s.life * 0.4; ctx.translate(s.x, s.y); ctx.rotate(s.a); ctx.fillStyle = '#111'; ctx.fillRect(-16, -9, 6, 3); ctx.fillRect(-16, 6, 6, 3); ctx.restore(); }
  if (!spect) {
    for (const c of coins) if (Math.abs(c.x - camX) < CW && Math.abs(c.y - camY) < CH) drawCoin(c);
    if (wrench) drawWrench(wrench);
    for (const w of wrecks) drawCar(w);
    for (const c of civs) drawCar(c);
    for (const p of police) drawCar(p);
  }
  if (window.Race && Race.online) Race.drawGhosts();
  if (!spect && player && endReason !== 'wrecked') drawCar(player);
  if (!spect && player && bustT > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(player.x, player.y, 30, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#ef4444'; ctx.beginPath(); ctx.arc(player.x, player.y, 30, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, bustT / 100)); ctx.stroke();
  }
  drawBuildings(vx0, vy0, vx1, vy1);
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life) * (p.color === 'smoke' ? 0.45 : 1);
    ctx.fillStyle = p.color === 'smoke' ? '#9ca3af' : p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (!spect && heli) {
    ctx.fillStyle = 'rgba(254,249,195,0.12)'; ctx.beginPath(); ctx.arc(player.x, player.y, 70, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(heli.x, heli.y - 60);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(20, 70, 26, 12, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 12, 0, 0, 7); ctx.fill(); ctx.fillRect(-46, -3, 30, 6);
    ctx.strokeStyle = 'rgba(203,213,225,0.7)'; ctx.lineWidth = 3; const ra = frame * 0.5;
    ctx.beginPath(); ctx.moveTo(Math.cos(ra) * 40, Math.sin(ra) * 40); ctx.lineTo(-Math.cos(ra) * 40, -Math.sin(ra) * 40); ctx.moveTo(Math.cos(ra + 1.57) * 40, Math.sin(ra + 1.57) * 40); ctx.lineTo(-Math.cos(ra + 1.57) * 40, -Math.sin(ra + 1.57) * 40); ctx.stroke();
    ctx.restore();
  }
  for (const f of floats) {

// ── minimap ──
const mini = document.getElementById('miniMap'), mctx = mini.getContext('2d');

// ═══════════════════════════════════════════════

// canvas size: wide on computers, tall on phones
function fitCanvas() {

// ═══════════════════════════════════════════════
//  PAUSE & BUTTONS

<script>
// ═══════════════════════════════════════════════
//  ONLINE RACE (games/shared/online.js)
//  2–4 players drive in the same city (same seed) on their own devices,
//  each chased by their own police. Other players show up as see-through
//  "ghost" cars (no crashing into each other). 3 races of up to 90 s:
//  the longest escape wins; if several last the full 90 s, more cash wins.
//  Positions go through the room's live channel (one doc per player, ~2 per second);
//  the host runs the CPU drivers and decides when a race is over.
// ═══════════════════════════════════════════════
const Race = window.Race = {
  online: false, race: 0, seed: 0, round: -1, key: '', resultKey: '',
  live: {}, ghosts: {}, unLive: null, cpus: {}, lastPush: 0,
  countdownTimer: null, hostTimer: null, nextTimer: null,
  raceStartAt: 0, resultSeenAt: 0, done: false, watch: -1, announced: new Set(),

const RACE_COLORS = ['#06b6d4', '#f59e0b', '#a855f7', '#ef4444'];
const POINTS = [3, 2, 1, 0];
const CPU_SKILL = { easy: { min: 25, max: 62, cash: 8 }, medium: { min: 42, max: 112, cash: 12 }, hard: { min: 60, max: 135, cash: 16 } };   // cash per second
const tt = (k, ...a) => SillyI18n.t(k, ...a);
const room = () => SillyOnline.room;
const mySeat = () => SillyOnline.mySeat();
const seatId = i => { const s = room() && room().seats[i]; return !s ? null : s.cpu ? 'cpu' + i : s.id; };
function seatName(i, short) {
  const s = room() && room().seats[i];
  if (!s) return '';
  const nm = s.cpu ? tt('cpuName', s.level) : s.name;
  if (short) return nm;
  return nm + (i === mySeat() ? (SillyI18n.lang === 'zh' ? `（${tt('you2')}）` : ` (${tt('you2')})`) : '');
}
Race.myColor = () => RACE_COLORS[Math.max(0, mySeat())];
Race.watchOnly = () => mySeat() < 0 || !player;

// latest state of seat i in the current race
function liveOf(i) {
  if (i === mySeat() && Race.race && player) return { x: player.x, y: player.y, a: player.a, cash, t: runFrames, done: Race.done, end: endReason, hp: player.hp };
  const c = Race.cpus[i];
  if (c && c.race === Race.race) return { x: c.x, y: c.y, a: c.a, cash: Math.floor(c.cash), t: c.frames, done: c.done, end: c.end };
  const L = Race.live[seatId(i)];
  return L && L.round === Race.round && L.race === Race.race ? L : null;
}

// ── my run ──
function pushLive(force) {
  const now = Date.now();
  if (!force && now - Race.lastPush < 500) return;
  Race.lastPush = now;
  const me = mySeat(); if (me < 0 || !Race.race || !player) return;
  SillyOnline.liveSet(SillyOnline.me.id, {
    seat: me, round: Race.round, race: Race.race,
    x: Math.round(player.x), y: Math.round(player.y), a: +player.a.toFixed(2),
    vx: +player.vx.toFixed(2), vy: +player.vy.toFixed(2),

}
Race.tick = function () { pushLive(false); };
Race.finish = function (reason) {
  Race.done = true;
  pushLive(true);
  gameState = 'spectate';
  Race.watch = -1; Race.nextWatch(true);
  renderBoard();
};
function startRun() {
  clearInterval(Race.countdownTimer); Race.countdownTimer = null;
  resetRun();
  Race.done = false;
  gameState = 'running';
  pushLive(true);
  ensureLoop();
}
// 3-2-1 before every race (also starts the host's CPU drivers)
function countdown() {
  clearInterval(Race.countdownTimer);
  buildCity(Race.seed);
  player = makeCar('player', SPAWN.x, SPAWN.y, 0);
  police = []; civs = []; coins = []; wrecks = []; particles = []; floats = []; skids = []; heli = null;
  cash = 0; runFrames = 0; star = 1; bustT = 0; endReason = '';
  camX = SPAWN.x; camY = SPAWN.y;
  Race.ghosts = {};
  gameState = 'countdown'; ensureLoop();
  updateUI();
  const goAt = Date.now() + 3200;
  let started = false;
  Race.cdText = '3';
  const tick = () => {
    const left = goAt - Date.now();
    Race.cdText = left > 0 ? String(Math.ceil(left / 1000)) : 'GO!';
    if (left <= -250 && !started) {
      started = true; Race.cdText = '';
      Race.raceStartAt = Date.now();
      if (SillyOnline.isHost()) startCpus();
      if (mySeat() >= 0) startRun();
      else { clearInterval(Race.countdownTimer); gameState = 'spectate'; Race.watch = -1; Race.nextWatch(true); }
    }
    if (started && left < -1200) clearInterval(Race.countdownTimer);
  };
  tick();
  Race.countdownTimer = setInterval(tick, 100);
}

// ── other players: smooth "ghost" cars ──
Race.ghostStep = function () {
  const me = mySeat();
  (room() ? room().seats : []).forEach((s, i) => {
    if (!s || i === me) return;
    const L = liveOf(i);
    if (!L || L.x == null) return;
    let g = Race.ghosts[i];
    const isCpu = !!Race.cpus[i];
    if (!g) g = Race.ghosts[i] = { x: L.x, y: L.y, a: L.a, recv: Date.now(), src: null };
    if (!isCpu && g.src !== L.at) { g.src = L.at; g.recv = Date.now(); }
    // predict from the last report, then ease toward it
    const k = isCpu ? 0 : Math.min(36, (Date.now() - g.recv) / STEP);
    const tx = L.x + (L.done ? 0 : (L.vx || 0) * k), ty = L.y + (L.done ? 0 : (L.vy || 0) * k);

    g.a += angNorm(L.a - g.a) * 0.25;

};
Race.drawGhosts = function () {
  for (const [i, g] of Object.entries(Race.ghosts)) {
    const s = room() && room().seats[i]; if (!s) continue;
    if (g.x < camX - CW / 2 - 60 || g.x > camX + CW / 2 + 60 || g.y < camY - CH / 2 - 60 || g.y > camY + CH / 2 + 60) continue;
    drawCar({ kind: 'ghost', x: g.x, y: g.y, a: g.a, r: 14, color: RACE_COLORS[i] }, g.done && g.end !== 'escaped' ? 0.3 : 0.6);
    const nm = seatName(+i, true);
    ctx.font = 'bold 13px Segoe UI, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(nm, g.x, g.y - 22);
    ctx.fillStyle = RACE_COLORS[i]; ctx.fillText(nm, g.x, g.y - 22);
    if (g.done && g.end !== 'escaped') { ctx.fillStyle = '#f87171'; ctx.fillText('BUSTED', g.x, g.y - 36); }
  }
  if (Race.cdText) {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0, 0, CW, CH);
    hudText(`RACE ${Race.race} / 3`, CW / 2, CH / 2 - 110, 24, '#fbbf24', 'center');
    hudText(Race.cdText, CW / 2, CH / 2 - 70, 110, '#fbbf24', 'center');
    ctx.restore();
  }
  if (gameState === 'spectate' && Race.watch >= 0) {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    hudText(`WATCHING: ${seatName(Race.watch, true)}`, CW / 2, CH - 40, 18, '#e2e8f0', 'center');
    ctx.restore();
  }
};
Race.drawMiniGhosts = function (m, S) {
  for (const [i, g] of Object.entries(Race.ghosts)) {
    m.fillStyle = '#fff'; m.beginPath(); m.arc(g.x * S, g.y * S, 3.5, 0, 7); m.fill();
    m.fillStyle = RACE_COLORS[i]; m.beginPath(); m.arc(g.x * S, g.y * S, 2.4, 0, 7); m.fill();
  }
};
// after my run (or as a spectator) the camera follows someone else
Race.nextWatch = function (preferAlive) {
  const seats = (room() ? room().seats : []).map((s, i) => i).filter(i => room().seats[i] && i !== mySeat() && Race.ghosts[i]);
  if (!seats.length) { Race.watch = -1; return; }
  if (preferAlive) { const alive = seats.find(i => !Race.ghosts[i].done); Race.watch = alive != null ? alive : seats[0]; return; }
  const k = seats.indexOf(Race.watch);
  Race.watch = seats[(k + 1) % seats.length];
};
Race.spectStep = function () {
  if (Race.watch < 0 || !Race.ghosts[Race.watch]) Race.nextWatch(true);
  const g = Race.ghosts[Race.watch];
  if (g) updateCamera(g.x, g.y, 0, 0);
  else if (player) updateCamera(player.x, player.y, 0, 0);
};

// ── host: CPU drivers (they roam the streets; how long they last depends on their level) ──
function startCpus() {
  Race.cpus = {};
  room().seats.forEach((s, i) => {
    if (!s || !s.cpu) return;
    const rng = mulberry32(Race.seed ^ ((i + 1) * 7919));
    const sk = CPU_SKILL[s.level] || CPU_SKILL.medium;
    const bust = Math.round((sk.min + rng() * (sk.max - sk.min)) * 60);
    Race.cpus[i] = { race: Race.race, x: SPAWN.x, y: SPAWN.y, a: 0, dir: [1, 0], goal: null, frames: 0, cash: 0, rate: sk.cash * (0.8 + rng() * 0.4), bustAt: bust, done: false, end: '', rng, lastPush: 0, pushedDone: false };
  });
}
function stepCpu(c, n) {
  for (let k = 0; k < n && !c.done; k++) {
    c.frames++;
    c.cash += c.rate / 60 * (c.rng() < 0.5 ? 0.6 : 1.4);
    const cx = Math.floor(c.x / CELL), cy = Math.floor(c.y / CELL);
    if (!c.goal || Math.hypot(c.goal[0] - c.x, c.goal[1] - c.y) < 6) {
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => passT(cellAt(cx + dx, cy + dy)));
      let pick = dirs.filter(([dx, dy]) => !(dx === -c.dir[0] && dy === -c.dir[1]));
      if (!pick.length) pick = dirs;
      const keep = pick.find(([dx, dy]) => dx === c.dir[0] && dy === c.dir[1]);
      c.dir = keep && c.rng() < 0.75 ? keep : pick[Math.floor(c.rng() * pick.length)] || [1, 0];
      c.goal = [(cx + c.dir[0] + 0.5) * CELL, (cy + c.dir[1] + 0.5) * CELL];
    }
    const dx = c.goal[0] - c.x, dy = c.goal[1] - c.y, d = Math.hypot(dx, dy) || 1, sp = Math.min(d, 4.4);
    c.x += dx / d * sp; c.y += dy / d * sp;
    c.a += angNorm(Math.atan2(dy, dx) - c.a) * 0.2;
    if (c.frames >= c.bustAt) { c.done = true; c.end = 'busted'; }
    else if (c.frames >= RACE_FRAMES) { c.done = true; c.end = 'escaped'; }
  }
}
function hostTick() {
  const r = room();
  if (!Race.online || !r || !r.state || !SillyOnline.isHost()) return;
  const st = r.state;
  if (st.phase === 'run' && st.race === Race.race && Race.raceStartAt) {
    const due = Math.floor((Date.now() - Race.raceStartAt) / STEP);
    for (const [i, c] of Object.entries(Race.cpus)) {
      if (c.race !== Race.race) continue;
      stepCpu(c, due - c.frames);
      if (Date.now() - c.lastPush > 500 || (c.done && !c.pushedDone)) {
        c.lastPush = Date.now(); if (c.done) c.pushedDone = true;
        SillyOnline.liveSet('cpu' + i, { seat: +i, round: Race.round, race: Race.race, x: Math.round(c.x), y: Math.round(c.y), a: +c.a.toFixed(2), vx: c.done ? 0 : c.dir[0] * 4.4, vy: c.done ? 0 : c.dir[1] * 4.4, cash: Math.floor(c.cash), t: c.frames, done: c.done, end: c.end, at: Date.now() });
      }
    }
    // is everyone done? (left / offline / well past 90 s count as done with what they have)
    const timeUp = Date.now() - Race.raceStartAt > (RACE_SEC + 15) * 1000;
    const fin = r.seats.map((s, i) => {
      if (!s) return true;
      if (s.cpu) return !!(Race.cpus[i] && Race.cpus[i].done);
      const L = liveOf(i);
      return !!(L && L.done) || !!s.left || !SillyOnline.isOnline(r, s.id) || timeUp;
    });
    if (fin.every(Boolean)) {
      const rows = r.seats.map((s, i) => {
        const L = liveOf(i);
        return { seat: i, t: L ? Math.min(RACE_FRAMES, L.t || 0) : 0, cash: L ? L.cash || 0 : 0 };
      });
      const race = Race.race;
      SillyOnline.mutate(rr => {
        if (!rr.state || rr.state.phase !== 'run' || rr.state.race !== race) return;
        const better = (y, x) => y.t > x.t || (y.t === x.t && y.cash > x.cash);
        const ranked = rows.slice().sort((a, b) => b.t - a.t || b.cash - a.cash);
        ranked.forEach(x => {
          const n = ranked.filter(y => better(y, x)).length;
          x.rank = n + 1; x.pts = POINTS[Math.min(n, 3)];
          rr.state.points[x.seat] = (rr.state.points[x.seat] || 0) + x.pts;
          rr.state.sums[x.seat] = (rr.state.sums[x.seat] || 0) + x.cash;
        });
        rr.state.results[race] = ranked;
        rr.state.phase = 'result';
        return rr;
      });
    }
  } else if (st.phase === 'result' && Race.resultSeenAt && Date.now() - Race.resultSeenAt > 6500) {
    const race = st.race;
    Race.resultSeenAt = 0;
    SillyOnline.mutate(rr => {
      if (!rr.state || rr.state.phase !== 'result' || rr.state.race !== race) return;
      if (race >= 3) rr.state.phase = 'done';
      else { rr.state.race = race + 1; rr.state.seed = (Math.random() * 2 ** 31) | 0; rr.state.phase = 'run'; }
      return rr;
    });
  }
}

// ── side board + "X got busted" toasts ──
function renderBoard() {
  const r = room(); if (!Race.online || !r) return;
  const st = r.state || {};
  document.getElementById('rbTitle').textContent = st.race ? tt('raceN', st.race) : tt('racers');
  document.getElementById('rbRows').innerHTML = r.seats.map((s, i) => {
    if (!s) return '';
    const L = liveOf(i);
    const off = !s.cpu && s.id !== SillyOnline.me.id && !SillyOnline.isOnline(r, s.id);
    const status = s.left ? tt('leftTag') : off ? tt('offlineTag') : L && L.done ? (L.end === 'escaped' ? tt('escapedTag') : tt('bustedTag')) : tt('driving');
    const pts = (st.points || {})[i] || 0;
    return `<div class="rb-row"><div class="rb-top"><span class="dot" style="background:${RACE_COLORS[i]}"></span>
      <span class="nm">${SillyOnline.esc(seatName(i))}</span><span class="ct">$${L ? L.cash || 0 : 0}</span></div>
      <div class="rb-sub">${status} · ${fmtTime(L ? L.t || 0 : 0)} · ${pts} ${SillyI18n.lang === 'zh' ? '分' : 'pts'}</div></div>`;
  }).join('');
  const note = mySeat() < 0 ? tt('watching') : Race.done && st.phase === 'run' ? tt('waitOthers') : tt('raceRule');
  document.getElementById('rbNote').textContent = note;
  // toasts when someone else's run ends
  if (st.phase === 'run') r.seats.forEach((s, i) => {
    if (!s || i === mySeat()) return;
    const L = liveOf(i), k = `${Race.round}:${Race.race}:${i}`;
    if (L && L.done && !Race.announced.has(k)) { Race.announced.add(k); toast(L.end === 'escaped' ? tt('gotEscaped', seatName(i)) : tt('gotBusted', seatName(i))); }
  });
}

// ── results ──
function showRaceResult(st, final) {
  const r = room();
  const me = mySeat();
  const medal = k => k === 1 ? '🥇' : k === 2 ? '🥈' : k === 3 ? '🥉' : k;
  let title, sub;
  if (!final) {
    const res = st.results[st.race] || [];
    title = tt('raceResult', st.race);
    document.getElementById('raceTable').innerHTML =
      `<tr><th>${tt('colRank')}</th><th>${tt('colPlayer')}</th><th class="num">${tt('colTime')}</th><th class="num">${tt('colCash')}</th><th class="num">${tt('colPts')}</th><th class="num">${tt('colTotal')}</th></tr>` +
      res.map(x => `<tr class="${x.seat === me ? 'me' : ''} ${x.rank === 1 ? 'top' : ''}"><td>${medal(x.rank)}</td>
        <td><span style="color:${RACE_COLORS[x.seat]}">●</span> ${SillyOnline.esc(seatName(x.seat))}</td><td class="num">${fmtTime(x.t)}</td><td class="num">$${x.cash}</td><td class="num">+${x.pts}</td><td class="num">${st.points[x.seat] || 0}</td></tr>`).join('');
    sub = tt('ptsRule');
  } else {
    title = tt('finalResult');
    const seats = r.seats.map((s, i) => i).filter(i => r.seats[i]);
    const ranked = seats.map(i => ({ seat: i, pts: st.points[i] || 0, sum: st.sums[i] || 0 })).sort((a, b) => b.pts - a.pts || b.sum - a.sum);
    ranked.forEach(x => { x.rank = ranked.filter(y => y.pts > x.pts || (y.pts === x.pts && y.sum > x.sum)).length + 1; });
    const champs = ranked.filter(x => x.rank === 1);
    sub = champs.length > 1 ? tt('coChamps', champs.map(x => seatName(x.seat)).join(SillyI18n.lang === 'zh' ? '、' : ', '))
      : champs[0].seat === me ? tt('youChamp') : tt('champion', seatName(champs[0].seat));
    document.getElementById('raceTable').innerHTML =
      `<tr><th>${tt('colRank')}</th><th>${tt('colPlayer')}</th><th class="num">${tt('colCashSum')}</th><th class="num">${tt('colTotal')}</th></tr>` +
      ranked.map(x => `<tr class="${x.seat === me ? 'me' : ''} ${x.rank === 1 ? 'top' : ''}"><td>${x.rank === 1 ? '🏆' : x.rank}</td>
        <td><span style="color:${RACE_COLORS[x.seat]}">●</span> ${SillyOnline.esc(seatName(x.seat))}</td><td class="num">$${x.sum}</td><td class="num">${x.pts}</td></tr>`).join('');
    if (me >= 0) champs.some(x => x.seat === me) ? Sound.win() : Sound.bust();
  }
  document.getElementById('raceTitle').textContent = title;
  document.getElementById('raceSub').textContent = sub;
  const again = document.getElementById('raceAgainBtn');
  again.textContent = SillyOnline.isHost() ? tt('rematch') : tt('waitHost');
  again.disabled = !SillyOnline.isHost();
  document.getElementById('raceBtns').style.display = final ? '' : 'none';
  clearInterval(Race.nextTimer);
  if (!final && st.race < 3) {
    const at = Date.now() + 6500;
    const upd = () => { const s = Math.max(0, Math.ceil((at - Date.now()) / 1000)); document.getElementById('raceNext').textContent = tt('nextRace', s); if (!s) clearInterval(Race.nextTimer); };
    upd(); Race.nextTimer = setInterval(upd, 250);
  } else document.getElementById('raceNext').textContent = '';
  document.getElementById('raceOverlay').classList.add('active');
}

// ── room updates ──
function onRoom(r) {
  Race.online = true;
  document.body.classList.add('racing');
  document.getElementById('startOverlay').classList.remove('active');
  document.getElementById('resultOverlay').classList.remove('active');
  if (!Race.unLive) Race.unLive = SillyOnline.liveWatch(map => { Race.live = map; renderBoard(); });
  if (!Race.hostTimer) Race.hostTimer = setInterval(() => { hostTick(); renderBoard(); }, 400);
  const st = r.state; if (!st) return;
  const key = r.round + ':' + st.race + ':' + st.seed;
  if (st.phase === 'run' && key !== Race.key) {
    Race.key = key; Race.round = r.round; Race.race = st.race; Race.seed = st.seed;
    Race.cpus = {}; Race.raceStartAt = 0; Race.done = false;
    document.getElementById('raceOverlay').classList.remove('active');
    countdown();
  } else if (st.phase === 'result' && Race.resultKey !== key) {
    Race.resultKey = key; Race.resultSeenAt = Date.now();
    if (gameState === 'running') { Race.done = true; gameState = 'spectate'; }
    showRaceResult(st, false);
  } else if (st.phase === 'done' && Race.resultKey !== key + ':done') {
    Race.resultKey = key + ':done';
    if (gameState === 'running') { Race.done = true; gameState = 'spectate'; }
    showRaceResult(st, true);
  }
  renderBoard();
}
function raceExit() {
  clearInterval(Race.countdownTimer); clearInterval(Race.hostTimer); clearInterval(Race.nextTimer);
  Race.hostTimer = null; if (Race.unLive) Race.unLive(); Race.unLive = null;
  Object.assign(Race, { online: false, done: false, race: 0, key: '', resultKey: '', cpus: {}, live: {}, ghosts: {}, cdText: '' });
  document.body.classList.remove('racing');
  document.getElementById('raceOverlay').classList.remove('active');
  gameState = 'idle';
  buildCity(20261025);
  player = makeCar('player', SPAWN.x, SPAWN.y, 0); police = []; civs = []; coins = []; wrecks = []; endReason = ''; bustT = 0;
  camX = SPAWN.x; camY = SPAWN.y;
  render(false); drawMini(); updateUI();
  document.getElementById('startBtn').textContent = SillyI18n.t('startGame');
  document.getElementById('startOverlay').classList.add('active');
}
async function raceLeave() { await SillyOnline.leave(); }
let toastT = null;
function toast(msg) {
  const el = document.getElementById('raceToast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600);
}

SillyOnline.mount({
  game: 'escape-road',
  title: { zh: '極速逃亡', en: 'Escape Road' },
  seats: 2,
  seatCounts: [2, 3, 4],
  defaultSeats: () => 2,
  seatLabel: (i, l) => (l === 'zh' ? ['藍', '橘', '紫', '紅'] : ['Blue', 'Orange', 'Purple', 'Red'])[i],
  seatColor: i => RACE_COLORS[i],
  cpuLevels: ['easy', 'medium', 'hard'],
  newState: () => ({ race: 1, seed: (Math.random() * 2 ** 31) | 0, phase: 'run', results: {}, points: {}, sums: {} }),
  onRoom: r => onRoom(r),
  onExit: () => raceExit(),
  onCancelEntry: () => document.getElementById('startOverlay').classList.add('active'),
});

document.getElementById('onlineBtn').addEventListener('click', () => {
  if (gameState === 'paused') { gameState = 'idle'; setPauseBtnText(false); }
  Sound.unlock();
  document.getElementById('startOverlay').classList.remove('active');
  SillyOnline.openEntry();
});
document.getElementById('raceAgainBtn').addEventListener('click', () => { if (SillyOnline.isHost()) SillyOnline.rematch(); });
document.getElementById('raceCloseBtn').addEventListener('click', () => document.getElementById('raceOverlay').classList.remove('active'));
document.getElementById('raceLeaveBtn').addEventListener('click', () => raceLeave());
document.getElementById('exitBtn').addEventListener('click', async e => {
  if (!Race.online) return;
  e.stopImmediatePropagation();
  if (!confirm(SillyI18n.lang === 'zh' ? '確定要離開房間嗎？' : 'Leave the room?')) return;
  await raceLeave(); window.location.href = '../../';
}, true);
SillyI18n.onChange(() => {
  if (!Race.online) return;
  renderBoard();
  const st = room() && room().state;
  if (st && document.getElementById('raceOverlay').classList.contains('active')) showRaceResult(st, st.phase === 'done');
});
</script>
